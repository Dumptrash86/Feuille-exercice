<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fdf1f8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <title>Feuille d'exercices interactive</title>
  <style>
    :root {
      /* Palette « Bonbon » — rose & lavande (mockup 1a) */
      --bg: #fdf1f8;
      --blob-rose: #ffcded;
      --blob-lav: #d6cfff;

      --title: #764065;
      --subtitle: #6c5f67;
      --label: #7a6d75;
      --du: #897c84;
      --digit: #42373e;
      --ink: #42373e;
      --muted: #7a6d75;

      --brand: #f3b4dd;
      --brand-ink: #6b3459;
      --brand-deep: #c588b0;
      --tab-ink: #705d69;
      --key-ink: #654d5c;
      --op: #a46b91;
      --rule: #eebcdc;

      --panel: #ffffff;
      --line: #f2e3ec;
      --field: #fef8fc;
      --field-line: #e8d9e2;

      --ok-bg: #b9eec2;
      --ok-ink: #00481b;
      --ok-line: #79c289;
      --bravo-ink: #137738;
      --bravo-bg: #c8f6d0;

      --bad-ink: #bd413f;
      --bad-bg: #ffdfda;
      --bad-line: #f8a49d;

      --carry-bg: #ffca9b;
      --carry-ink: #6d3800;

      --tens: #6959ae;
      --tens-dot: #b0a5f2;
      --tens-soft: #eae7ff;
      --ones: #945a00;
      --ones-dot: #efb062;
      --ones-soft: #ffe9cb;

      --ok: var(--bravo-ink);
      --bad: var(--bad-ink);
      --focus: #6959ae;

      --shadow-card: 0 4px 14px rgba(118, 64, 101, .08);
      --shadow-lift: 0 8px 24px rgba(118, 64, 101, .10);
      --radius-card: 22px;
      --radius-tile: 18px;
      --radius-key: 14px;

      --font-display: "Baloo 2", "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      --font-body: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      font-family: var(--font-body);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* Pastilles décoratives du mockup */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      top: -120px;
      right: -110px;
      width: 340px;
      height: 340px;
      background: var(--blob-rose);
      opacity: .55;
    }

    body::after {
      bottom: 90px;
      left: -100px;
      width: 240px;
      height: 240px;
      background: var(--blob-lav);
      opacity: .45;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 22px 18px 18px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      line-height: 1.1;
      color: var(--title);
    }

    .greeting {
      margin-top: 3px;
      font-size: clamp(.9rem, 2.4vw, 1rem);
      font-weight: 600;
      color: var(--subtitle);
    }

    .header-side {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .pdot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(118, 64, 101, .13);
      transition: background .2s ease, transform .2s ease;
    }

    .pdot.on {
      background: var(--brand);
      transform: scale(1.12);
    }

    .legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-weight: 700;
      margin-top: 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      box-shadow: var(--shadow-card);
      padding: 7px 13px;
      font-size: .86rem;
    }

    .dot { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
    .dot.tens { background: var(--tens-dot); }
    .dot.ones { background: var(--ones-dot); }

    /* Onglets */
    nav {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin: 0 0 16px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: var(--radius-key);
      background: #fff;
      color: var(--key-ink);
      min-height: 48px;
      padding: 10px 12px;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
    }

    button:active { transform: translateY(2px); }

    button:focus-visible,
    input:focus-visible {
      outline: 4px solid rgba(105, 89, 174, .32);
      outline-offset: 2px;
    }

    nav button {
      color: var(--tab-ink);
      box-shadow: 0 2px 0 rgba(118, 64, 101, .07);
    }

    nav button.active {
      background: var(--brand);
      color: var(--brand-ink);
      font-weight: 800;
      box-shadow: 0 4px 0 var(--brand-deep);
    }

    nav button.active:active { box-shadow: 0 2px 0 var(--brand-deep); }

    main {
      background: transparent;
      border: 0;
      box-shadow: none;
      overflow: visible;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 0;
      border-radius: var(--radius-tile);
      background: #fff;
      box-shadow: var(--shadow-card);
      margin-bottom: 14px;
    }

    .toolbar strong {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.02rem;
      color: var(--title);
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: end;
    }

    .toolbar-actions button { min-height: 44px; font-size: .95rem; }

    .primary {
      background: var(--brand);
      color: var(--brand-ink);
      font-weight: 800;
      box-shadow: 0 4px 0 var(--brand-deep);
    }

    .primary:active { box-shadow: 0 2px 0 var(--brand-deep); }

    .soft {
      background: #fff;
      color: var(--tab-ink);
      box-shadow: inset 0 0 0 2px var(--line);
    }

    .success {
      background: var(--bravo-bg);
      color: var(--bravo-ink);
      font-weight: 800;
    }

    .screen { display: none; padding: 0; }
    .screen.active { display: block; }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

    .exercise {
      border: 0;
      border-radius: var(--radius-card);
      padding: 20px 18px;
      min-height: 150px;
      display: grid;
      gap: 12px;
      align-content: start;
      background: #fff;
      box-shadow: var(--shadow-card);
    }

    .prompt {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 4vw, 2rem);
      font-weight: 700;
      line-height: 1.15;
      color: var(--digit);
    }

    .small-prompt {
      font-family: var(--font-display);
      font-size: clamp(1rem, 2.8vw, 1.3rem);
      font-weight: 700;
      line-height: 1.3;
      color: var(--title);
    }

    .num {
      display: inline-flex;
      align-items: baseline;
      gap: .02em;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }

    .tens { color: var(--tens); }
    .ones { color: var(--ones); }

    .answer-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }

    input {
      width: 100%;
      min-height: 56px;
      border: 3px solid var(--field-line);
      border-radius: var(--radius-key);
      padding: 8px 12px;
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 700;
      text-align: center;
      color: var(--digit);
      background: var(--field);
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }

    input.is-ok {
      background: var(--ok-bg);
      border-color: var(--ok-line);
      color: var(--ok-ink);
    }

    input.is-bad {
      background: var(--bad-bg);
      border-color: var(--bad-line);
      color: var(--bad-ink);
    }

    /* Bulle de retour « Bravo ! » */
    .feedback { min-height: 32px; font-weight: 800; font-size: .95rem; }

    .feedback.ok,
    .feedback.bad {
      display: inline-flex;
      align-items: center;
      justify-self: start;
      width: fit-content;
      padding: 6px 16px;
      border-radius: 20px;
      font-family: var(--font-display);
      font-weight: 800;
    }

    .feedback.ok {
      color: var(--bravo-ink);
      background: var(--bravo-bg);
      animation: pop .35s ease;
    }

    .feedback.bad { color: var(--bad-ink); background: var(--bad-bg); }

    @keyframes pop { 0% { transform: scale(0.8); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .feedback.ok { animation: none; }
      button, input, .pdot { transition: none; }
    }

    /* Astuce + barre d'actions (l'appareil ouvre son propre clavier numérique) */
    .toolbelt {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .hint-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: #fff;
      border-radius: var(--radius-tile);
      box-shadow: var(--shadow-card);
      padding: 14px 16px;
    }

    .hint-icon {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--carry-bg);
      display: grid;
      place-items: center;
      font-size: 1rem;
      line-height: 1;
    }

    .hint-body strong {
      display: block;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: .74rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--label);
    }

    .hint-body p {
      margin: 3px 0 0;
      font-weight: 600;
      font-size: .97rem;
      line-height: 1.42;
      color: var(--tab-ink);
    }

    .toolbelt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      background: #fff;
      box-shadow: var(--shadow-card);
      padding: 10px 16px;
      font-weight: 700;
      font-size: .93rem;
      color: var(--tab-ink);
    }

    .score-star { color: rgba(118, 64, 101, .22); font-size: 1.1rem; line-height: 1; }
    .score-pill.earned { background: var(--bravo-bg); color: var(--bravo-ink); }
    .score-pill.earned .score-star { color: #e8a33c; }

    .actionbar {
      display: grid;
      grid-template-columns: repeat(3, minmax(104px, 1fr));
      gap: 8px;
    }

    .actionbar button {
      min-height: 52px;
      box-shadow: 0 2px 6px rgba(118, 64, 101, .08);
    }

    .actionbar .primary { box-shadow: 0 4px 0 var(--brand-deep); }
    .actionbar .primary:active { box-shadow: 0 2px 0 var(--brand-deep); }

    /* Écran « Ranger » */
    .word-bank, .order-zone { display: flex; gap: 8px; flex-wrap: wrap; }

    .order-zone {
      min-height: 64px;
      border-radius: var(--radius-tile);
      background: var(--field);
      padding: 8px;
    }

    .pill {
      border: 0;
      background: #fff;
      min-height: 52px;
      border-radius: var(--radius-key);
      padding: 8px 16px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.3rem;
      box-shadow: var(--shadow-card);
    }

    .pill.selected {
      background: var(--brand);
      box-shadow: 0 2px 0 var(--brand-deep);
      opacity: .5;
    }

    .pill.selected .tens, .pill.selected .ones { color: var(--brand-ink); }

    .symbol-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .symbol-button {
      background: #fff;
      border: 0;
      box-shadow: var(--shadow-card);
      text-align: center;
      min-width: 84px;
      min-height: 64px;
      font-size: 2rem;
      color: var(--title);
    }

    .symbol-button.selected { background: var(--brand); color: var(--brand-ink); box-shadow: 0 3px 0 var(--brand-deep); }
    .symbol-button.correct { background: var(--ok-bg); color: var(--ok-ink); box-shadow: 0 3px 0 var(--ok-line); }
    .symbol-button.wrong { background: var(--bad-bg); color: var(--bad-ink); box-shadow: 0 3px 0 var(--bad-line); }

    .muted-text { color: var(--label); font-weight: 700; }

    /* Écran « Poser » — opération posée */
    .written-board {
      position: relative;
      display: grid;
      grid-template-columns: 38px 62px 62px;
      row-gap: 4px;
      width: max-content;
      margin: 4px auto 0;
      border: 0;
      border-radius: 0;
      overflow: visible;
      background: transparent;
      font-family: var(--font-display);
    }

    .written-board span,
    .written-board input {
      min-height: 46px;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--digit);
      border-radius: 0;
      padding: 0;
      text-align: center;
    }

    /* En-têtes « d » et « u » */
    .written-board > span:nth-child(2),
    .written-board > span:nth-child(3) {
      min-height: 20px;
      font-family: var(--font-body);
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .written-board span.tens { color: var(--tens); }
    .written-board span.ones { color: var(--ones); }

    .written-board span.retenue-cell { border: 0; min-height: 26px; background: transparent; padding: 0; }

    .written-board input.retenue-input {
      width: 26px;
      height: 26px;
      min-height: 26px;
      border-radius: 50%;
      border: 0;
      background: var(--carry-bg);
      color: var(--carry-ink);
      font-family: var(--font-body);
      font-size: .85rem;
      font-weight: 800;
      margin: 0 auto;
      padding: 0;
    }

    .written-board input.retenue-input.is-ok { background: var(--ok-bg); color: var(--ok-ink); }
    .written-board input.retenue-input.is-bad { background: var(--bad-bg); color: var(--bad-ink); }

    .written-board input.written-digit {
      border: 0;
      border-radius: 12px;
      background: var(--field);
      color: var(--digit);
      font-size: 1.75rem;
      min-height: 46px;
      box-shadow: inset 0 0 0 2px var(--field-line);
    }

    .written-board input.written-digit.is-ok {
      background: var(--ok-bg);
      color: var(--ok-ink);
      box-shadow: none;
    }

    .written-board input.written-digit.is-bad {
      background: var(--bad-bg);
      color: var(--bad-ink);
      box-shadow: none;
    }

    .written-board input:focus-visible { outline: 4px solid rgba(105, 89, 174, .3); outline-offset: 0; }

    .written-board span.rule {
      grid-column: 2 / -1;
      min-height: 0;
      height: 0;
      background: transparent;
      border: 0;
      border-top: 3px solid var(--rule);
      margin: 3px 0;
    }

    .written-board span.operator { color: var(--op); background: transparent; }

    /* Écran « Heure » */
    .clock-area { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 20px; align-items: center; }

    .time-context {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 999px;
      background: var(--field);
      box-shadow: inset 0 0 0 2px var(--line);
      padding: 8px 14px;
      margin-bottom: 10px;
      font-weight: 700;
      color: var(--tab-ink);
    }

    .sky-icon { width: 22px; height: 22px; display: inline-block; position: relative; border-radius: 50%; flex: 0 0 auto; }
    .sky-icon.matin { background: #ffc98f; box-shadow: 0 0 0 5px rgba(255, 201, 143, .28); }
    .sky-icon.apresmidi { background: #ffd75e; box-shadow: 0 0 0 5px rgba(255, 215, 94, .25); }
    .sky-icon.soir { background: #f79a6a; box-shadow: 0 0 0 5px rgba(247, 154, 106, .25); }
    .sky-icon.nuit { background: #6959ae; }
    .sky-icon.nuit::after { content: ""; position: absolute; width: 16px; height: 16px; right: -2px; top: 2px; border-radius: 50%; background: var(--panel); }

    .clock-face { width: min(300px, 100%); aspect-ratio: 1; display: block; margin: 0 auto; }

    .clock-number {
      font: 700 14px var(--font-display);
      fill: var(--digit);
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .hand-hour { stroke: var(--tens); stroke-width: 8; stroke-linecap: round; }
    .hand-minute { stroke: var(--ones-dot); stroke-width: 5; stroke-linecap: round; }

    .time-answer {
      display: grid;
      grid-template-columns: minmax(82px, 1fr) auto minmax(82px, 1fr);
      gap: 10px;
      align-items: center;
      margin: 12px 0;
      max-width: 340px;
    }

    .time-answer input { min-height: 64px; font-size: 1.8rem; }

    .time-separator {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--op);
      text-align: center;
    }

    @media (max-width: 760px) {
      .app { padding: 16px 12px 12px; }
      header { grid-template-columns: 1fr; }
      .header-side { justify-content: space-between; }
      nav { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
      nav button { font-size: .84rem; padding: 10px 4px; }
      .grid { grid-template-columns: 1fr; }
      .toolbar { align-items: start; flex-direction: column; }
      .toolbar-actions { justify-content: start; }
      .answer-row { grid-template-columns: minmax(0, 1fr) auto; }
      .toolbelt-row { flex-direction: column; align-items: stretch; }
      .actionbar { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .actionbar button { font-size: .88rem; padding: 10px 4px; }
      .clock-area { grid-template-columns: 1fr; }
      .clock-face { width: min(240px, 100%); }
      body::before { width: 220px; height: 220px; top: -90px; right: -80px; }
      body::after { width: 170px; height: 170px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Mes exercices</h1>
        <div class="greeting" id="greeting"></div>
        <div class="legend" aria-label="Légende des couleurs">
          <span class="chip"><span class="dot tens"></span>dizaines</span>
          <span class="chip"><span class="dot ones"></span>unités</span>
        </div>
      </div>
      <div class="header-side">
        <div class="progress-dots" id="progressDots" role="img" aria-label="Progression"></div>
        <button class="primary" id="resetProgress" type="button">Recommencer</button>
      </div>
    </header>

    <nav aria-label="Choisir un exercice">
      <button class="active" data-screen="mental" type="button">Calcul</button>
      <button data-screen="order" type="button">Ranger</button>
      <button data-screen="written" type="button">Poser</button>
      <button data-screen="hours" type="button">Heure</button>
    </nav>    <main>
      <section class="screen active" id="mental">
        <div class="toolbar">
          <strong>Calcule dans ta tête</strong>
          <div class="toolbar-actions">
            <button class="soft" data-check-screen="mental" type="button">Corriger</button>
            <button class="success" data-new="mental" type="button">Nouvelle série</button>
          </div>
        </div>
        <div class="grid" id="mentalGrid"></div>
      </section>

      <section class="screen" id="order">
        <div class="toolbar">
          <strong>Touche les nombres du plus petit au plus grand</strong>
          <div class="toolbar-actions">
            <button class="soft" id="undoOrder" type="button">Effacer le dernier</button>
            <button class="soft" data-check-screen="order" type="button">Corriger</button>
            <button class="success" data-new="order" type="button">Nouvelle série</button>
          </div>
        </div>
        <div class="exercise">
          <div class="small-prompt">Nombres à ranger</div>
          <div class="word-bank" id="orderBank"></div>
          <div class="small-prompt">Ma réponse</div>
          <div class="order-zone" id="orderAnswer"></div>
          <div class="feedback" id="orderFeedback"></div>
        </div>
      </section>

      <section class="screen" id="written">
        <div class="toolbar">
          <strong>Pose et calcule avec d et u</strong>
          <div class="toolbar-actions">
            <button class="soft" data-check-screen="written" type="button">Corriger</button>
            <button class="success" data-new="written" type="button">Nouvelle série</button>
          </div>
        </div>
        <div class="grid" id="writtenGrid"></div>
      </section>

      <section class="screen" id="hours">
        <div class="toolbar">
          <strong>Lis l'heure avec les aiguilles</strong>
          <div class="toolbar-actions">
            <button class="soft" data-check-screen="hours" type="button">Corriger</button>
            <button class="success" data-new="hours" type="button">Nouvelle heure</button>
          </div>

    // On ne propose que les astuces qui parlent de la série affichée
    function hintsFor(id){
      const keep=(list,tags)=>{
        const out=list.filter(h=>tags.includes(h.tag));
        return out.length?out:list;
      };
      if(id==="mental"){
        const serie=sets.mental[state.index.mental];
        const tags=[];
        const plain=f=>serie.some(it=>Array.isArray(it)&&f(it[0],it[1],it[2]));
        if(plain((a,op,b)=>op==="+"&&b%10===0)) tags.push("addTens");
        if(plain((a,op,b)=>op==="-"&&b%10===0)) tags.push("subTens");
        if(plain((a,op,b)=>op==="+"&&b<10&&(a%10+b)>=10)) tags.push("carry");
        if(plain((a,op,b)=>op==="-"&&b<10)) tags.push("subUnits");
        if(plain((a,op,b)=>op==="+"&&a===b)) tags.push("double");
        if(serie.some(it=>!Array.isArray(it))) tags.push("hole");
        if(serie.some(it=>!Array.isArray(it)&&it.result===100)) tags.push("hundred");
        return keep(hints.mental,tags);
      }
      if(id==="written"){
        const serie=sets.written[state.index.written];
        const tags=["any"];
        if(serie.some(it=>it[1]==="+")) tags.push("add");
        if(serie.some(it=>it[1]==="+"&&(it[0]%10+it[2]%10)>=10)) tags.push("carry");
        if(serie.some(it=>it[1]==="-")) tags.push("sub");
        return keep(hints.written,tags);
      }
      if(id==="order") return keep(hints.order,[sets.order[state.index.order].mode]);
      if(id==="hours"){
        const t=sets.hours[state.index.hours];
        const tags=["any"];
        if(t.minute===0) tags.push("pile");
        else if(t.minute===15) tags.push("quart");
        else if(t.minute===30) tags.push("demie");
        else if(t.minute===45) tags.push("moins");
        else tags.push("cinq");
        if(t.hour>12) tags.push("apresmidi");
        return keep(hints.hours,tags);
      }
      return [];
    }

    function pickVaried(list,key){
      if(list.length<2) return list[0];
      let i=Math.floor(Math.random()*list.length);
      if(i===state.lastPick[key]) i=(i+1)%list.length;
      state.lastPick[key]=i;
      return list[i];
    }

    function allInputsCorrect(selector){

        const actual=[...exercise.querySelectorAll(".written-digit")].map(i=>i.value).join("");
        const retenueInput=exercise.querySelector(".retenue-input");
        return actual===expected&&(!retenueInput||retenueInput.value==="1");
      });
    }

          return `<article class="exercise"><div class="prompt">${left} ${item.op} ${right} = ${colorNumber(item.result)}</div>${makeInput(item.answer,"mental")}</article>`;

        const [a,op,b]=item;

    function clockSvg(hour,minute){
      const hourAngle=((hour%12)*30)+(minute*0.5);
      const minuteAngle=minute*6;
      const numbers=Array.from({length:12},(_,i)=>{
        const v=i+1,angle=(v*30-90)*Math.PI/180;
        const x=100+Math.cos(angle)*76,y=100+Math.sin(angle)*76;
        return `<text class="clock-number" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${v}</text>`;
      }).join("");
      const ticks=Array.from({length:60},(_,i)=>{
        const angle=(i*6-90)*Math.PI/180,outer=92,inner=i%5===0?84:88;
        const x1=100+Math.cos(angle)*outer,y1=100+Math.sin(angle)*outer;
        const x2=100+Math.cos(angle)*inner,y2=100+Math.sin(angle)*inner;
        return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--du)" stroke-width="${i%5===0?2.5:1}"/>`;
      }).join("");
      return `<svg class="clock-face" viewBox="0 0 200 200" role="img" aria-label="Horloge à aiguilles"><circle cx="100" cy="100" r="95" fill="#fff" stroke="var(--rule)" stroke-width="6"/>${ticks}${numbers}<line class="hand-hour" x1="100" y1="100" x2="100" y2="48" transform="rotate(${hourAngle} 100 100)"/><line class="hand-minute" x1="100" y1="100" x2="100" y2="28" transform="rotate(${minuteAngle} 100 100)"/><circle cx="100" cy="100" r="6" fill="var(--brand-deep)"/></svg>`;
    }

    function setInputState(input,state){
      if(!input) return;
      input.classList.toggle("is-ok",state===true);
      input.classList.toggle("is-bad",state===false);
    }

    function updateProgressDots(){
      const screen=document.querySelector(".screen.active");
      const host=document.querySelector("#progressDots");
      if(!screen||!host) return;
      const cards=[...screen.querySelectorAll(".exercise")];
      const total=Math.max(cards.length,1);
      const done=cards.filter(c=>c.querySelector(".feedback.ok")).length;
      host.innerHTML=Array.from({length:total},(_,i)=>`<span class="pdot${i<done?" on":""}"></span>`).join("");
      host.setAttribute("aria-label",`${done} sur ${total} réussis`);
    }

    function setFeedback(input,ok){
      const feedback=input.closest(".exercise").querySelector(".feedback");
      feedback.textContent=ok?praise():retry();
      feedback.className=`feedback ${ok?"ok":"bad"}`;
      setInputState(input,ok);
    }

    function checkInput(input){
      if(input.dataset.kind==="written-digit"||input.dataset.kind==="retenue-digit") return checkWrittenBoard(input.closest(".exercise"));
      const ok=input.value.trim()!==""&&Number(input.value)===Number(input.dataset.expected);
      setFeedback(input,ok);
      if(ok&&input.dataset.kind==="mental"&&allInputsCorrect("#mental input")) scheduleNext("mental");
      return ok;
    }

    function maybeAutoCheckInput(input){
      if(!input) return;
      if(input.dataset.kind==="written-digit"||input.dataset.kind==="retenue-digit"){
        const exercise=input.closest(".exercise");
        const digits=[...exercise.querySelectorAll(".written-digit")];
        const retenueInput=exercise.querySelector(".retenue-input");
        const digitsComplete=digits.every(d=>d.value.length===1);
        const retenueComplete=!retenueInput||retenueInput.value.length===1;
        if(digitsComplete&&retenueComplete) checkWrittenBoard(exercise);
        return;
      }
      if(input.dataset.kind==="time-hour"||input.dataset.kind==="time-minute"){
        const hourInput=document.querySelector('[data-kind="time-hour"]');
        const minuteInput=document.querySelector('[data-kind="time-minute"]');
        if(input.dataset.kind==="time-hour"&&input.value.length>=2){
          if(minuteInput){state.activeInput=minuteInput;minuteInput.focus();minuteInput.select();}
        }
        if(hourInput&&minuteInput&&hourInput.value.length>0&&minuteInput.value.length===2) checkHours();
        return;
      }
      if(input.dataset.kind!=="mental") return;
      if(input.value.length===String(input.dataset.expected).length) checkInput(input);
    }

    function checkWrittenBoard(exercise){
      const inputs=[...exercise.querySelectorAll(".written-digit")];
      const expected=pad2(exercise.querySelector(".written-board").dataset.expected);
      const actual=inputs.map(i=>i.value).join("");
      const retenueInput=exercise.querySelector(".retenue-input");
      const retenueFilled=!retenueInput||retenueInput.value!=="";
      const retenueOk=!retenueInput||retenueInput.value==="1";
      const digitsOk=actual.length===2&&actual===expected;
      const ok=digitsOk&&retenueOk;
      const feedback=exercise.querySelector(".feedback");
      feedback.textContent=ok?praise():digitsOk&&retenueInput&&!retenueOk?"N'oublie pas la retenue !":retry();
      feedback.className=`feedback ${ok?"ok":"bad"}`;
      inputs.forEach((inp,i)=>{setInputState(inp,inp.value===expected[i]);});
      if(retenueInput) setInputState(retenueInput,retenueInput.value==="1"?true:retenueFilled?false:null);
      if(ok&&allWrittenBoardsCorrect()) scheduleNext("written");
      return ok;
    }

    function checkScreen(id){
      if(id==="order") return checkOrder();
      if(id==="hours") return checkHours();
      if(id==="written"){document.querySelectorAll("#written .exercise").forEach(checkWrittenBoard);return;}
      document.querySelectorAll(`#${id} input`).forEach(checkInput);
    }

    function checkOrder(){
      const task=sets.order[state.index.order];
      const feedback=document.querySelector("#orderFeedback");
      if(task.mode==="compare"){
        const expected=task.left<task.right?"lt":"gt";
        document.querySelectorAll("[data-compare]").forEach(b=>{
          setClass(b,"correct",b.dataset.compare===expected);
          setClass(b,"wrong",b.classList.contains("selected")&&b.dataset.compare!==expected);
        });
        const ok=state.selectedCompare===expected;
        feedback.textContent=ok?praise():"Regarde bien quel nombre est le plus grand";
        feedback.className=`feedback ${ok?"ok":"bad"}`;
        if(ok) scheduleNext("order");
        return;
      }
      const expectedValues=[...task.values].sort((a,b)=>task.mode==="desc"?b-a:a-b);
      const ok=expectedValues.join(",")===state.orderAnswer.join(",");
      feedback.textContent=ok?praise():task.mode==="desc"?"Regarde le nombre le plus grand qui reste":"Regarde le nombre le plus petit qui reste";
      feedback.className=`feedback ${ok?"ok":"bad"}`;
      if(ok) scheduleNext("order");
    }

    function checkHours(){
      const target=sets.hours[state.index.hours];
      const feedback=document.querySelector("#hoursFeedback");
      const hourInput=document.querySelector('[data-kind="time-hour"]');
      const minuteInput=document.querySelector('[data-kind="time-minute"]');
      const hour=Number(hourInput.value);
      const minute=Number(pad2(minuteInput.value));
      const ok=hour===target.hour&&minute===target.minute&&minuteInput.value.trim()!=="";
      setInputState(hourInput,hour===target.hour);
      setInputState(minuteInput,minute===target.minute&&minuteInput.value.trim()!=="");
      feedback.textContent=ok?praise():hour!==target.hour?"Regarde la petite aiguille : elle donne les heures":"Regarde la grande aiguille, et écris les minutes avec deux chiffres";
      feedback.className=`feedback ${ok?"ok":"bad"}`;
      if(ok) scheduleNext("hours");
    }

    function nextSet(id){
      clearAutoAdvance();
      if(id==="hours"){
        let next=state.index.hours;
        while(next===state.index.hours&&sets.hours.length>1) next=Math.floor(Math.random()*sets.hours.length);
        state.index.hours=next;
        renderHours();wireInputs();return;
      }
      if(id==="order"||id==="mental"||id==="written"){
        let next=state.index[id];
        while(next===state.index[id]&&sets[id].length>1) next=Math.floor(Math.random()*sets[id].length);
        state.index[id]=next;
        renderAll();return;
      }
    }

    function renderAll(){
      renderMental();renderOrder();renderWritten();renderHours();
      wireInputs();updateToolbelt();
    }

    function updateToolbelt(){
      const activeScreen=document.querySelector(".screen.active");
      const bar=document.querySelector(".actionbar");
      if(!activeScreen) return;
      // l'écran « Ranger » se joue au doigt : ni saisie, ni touches d'édition
      if(bar) bar.style.display=activeScreen.id==="order"?"none":"grid";
      updateHint(activeScreen.id);
    }

    function wireInputs(){
      document.querySelectorAll("input").forEach(input=>{
        input.addEventListener("focus",()=>{state.activeInput=input;});
        input.addEventListener("click",()=>{state.activeInput=input;});
        input.addEventListener("touchstart",()=>{state.activeInput=input;});
        input.addEventListener("input",()=>{
          const maxLength=(input.dataset.kind==="written-digit"||input.dataset.kind==="retenue-digit")?1:2;
          input.value=input.value.replace(/\D/g,"").slice(0,maxLength);
          setInputState(input,null);
          const feedback=input.closest(".exercise").querySelector(".feedback");
          feedback.textContent="";feedback.className="feedback";
          maybeAutoCheckInput(input);
        });
      });
      document.querySelectorAll(".check-one").forEach(b=>b.addEventListener("click",()=>checkInput(b.parentElement.querySelector("input"))));
      document.querySelectorAll("[data-order-value]").forEach(b=>{
        b.addEventListener("click",()=>{
          if(b.classList.contains("selected")) return;
          const value=Number(b.dataset.orderValue);
          b.classList.add("selected");
          state.orderAnswer.push(value);
          document.querySelector("#orderAnswer").insertAdjacentHTML("beforeend",`<span class="pill">${colorNumber(value)}</span>`);
          const task=sets.order[state.index.order];
          if(task.mode!=="compare"&&state.orderAnswer.length===task.values.length) checkOrder();
        });
      });
      document.querySelectorAll("[data-compare]").forEach(b=>{
        b.addEventListener("click",()=>{
          state.selectedCompare=b.dataset.compare;
          document.querySelectorAll("[data-compare]").forEach(i=>i.classList.remove("selected","correct","wrong"));
          b.classList.add("selected");
          const display=document.querySelector("#compareDisplay");
          if(display){display.textContent=b.dataset.compare==="lt"?"<":">";display.classList.remove("muted-text");}
          checkOrder();
        });
      });
    }

    document.querySelectorAll("nav button").forEach(b=>{
      b.addEventListener("click",()=>{
        document.querySelectorAll("nav button").forEach(i=>i.classList.remove("active"));
        document.querySelectorAll(".screen").forEach(i=>i.classList.remove("active"));
        b.classList.add("active");
        document.querySelector(`#${b.dataset.screen}`).classList.add("active");
        state.activeInput=document.querySelector(".screen.active input");
        if(state.activeInput) state.activeInput.focus();
        updateToolbelt();
      });
    });

    document.querySelectorAll("[data-check-screen]").forEach(b=>b.addEventListener("click",()=>checkScreen(b.dataset.checkScreen)));
    document.querySelectorAll("[data-new]").forEach(b=>b.addEventListener("click",()=>nextSet(b.dataset.new)));

    document.querySelector("#undoOrder").addEventListener("click",()=>{
      const removed=state.orderAnswer.pop();
      if(removed===undefined) return;
      const btn=document.querySelector(`#orderBank [data-order-value="${removed}"]`);
      if(btn) btn.classList.remove("selected");
      const last=document.querySelector("#orderAnswer").lastElementChild;
      if(last) last.remove();
    });

    document.querySelector("#resetProgress").addEventListener("click",()=>{
      if(!confirm("Recommencer depuis le début ?")) return;
      Object.keys(state.index).forEach(k=>{state.index[k]=0;});
      renderAll();
    });

    document.querySelectorAll("[data-key]").forEach(b=>{
      b.addEventListener("click",()=>{
        const activeScreen=document.querySelector(".screen.active");
        const focusedInput=document.activeElement&&document.activeElement.tagName==="INPUT"&&activeScreen&&activeScreen.contains(document.activeElement)?document.activeElement:null;
        const activeInputIsUsable=state.activeInput&&state.activeInput.isConnected&&activeScreen&&activeScreen.contains(state.activeInput);
        const input=focusedInput?focusedInput:activeInputIsUsable?state.activeInput:activeScreen?activeScreen.querySelector("input"):null;
        if(!input) return;
        state.activeInput=input;input.focus();
        const key=b.dataset.key;
        if(key==="back") input.value=input.value.slice(0,-1);
        if(key==="clear") input.value="";
        if(key==="next"){
          const inputs=[...document.querySelectorAll(".screen.active input")];
          const next=inputs[(inputs.indexOf(input)+1)%inputs.length];
          if(next){state.activeInput=next;next.focus();}
          return;
        }
        input.dispatchEvent(new Event("input"));
      });
    });

    document.querySelector("#greeting").textContent=pickVaried(greetings,"greeting");
    updateScore();
    renderAll();
    updateProgressDots();
    new MutationObserver(updateProgressDots).observe(document.querySelector("main"),{subtree:true,childList:true,attributes:true,attributeFilter:["class"]});
  </script>
</body>
</html>
