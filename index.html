<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feuille d'exercices interactive</title>
  <style>
    :root {
      --bg: #fff8ed;
      --ink: #243043;
      --muted: #6b7280;
      --panel: #ffffff;
      --line: #e5ded2;
      --tens: #16a34a;
      --ones: #eab308;
      --ok: #16a34a;
      --bad: #dc2626;
      --focus: #7c3aed;
      --shadow: 0 14px 36px rgba(36, 48, 67, .12);
      font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(22, 163, 74, .08) 1px, transparent 1px) 0 0 / 34px 34px,
        linear-gradient(rgba(234, 179, 8, .1) 1px, transparent 1px) 0 0 / 34px 34px,
        var(--bg);
      min-height: 100vh;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.25rem);
      line-height: 1.1;
    }

    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-weight: 800;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 8px 12px;
      font-size: .95rem;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.tens { background: var(--tens); }
    .dot.ones { background: var(--ones); }

    nav {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      margin: 8px 0 14px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      background: #eef2ff;
      color: var(--ink);
      min-height: 48px;
      padding: 10px 12px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible { outline: 4px solid rgba(124, 58, 237, .3); outline-offset: 2px; }
    nav button.active { background: var(--focus); color: #fff; }

    main {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-bottom: 2px solid var(--line);
      background: #fffbf5;
    }

    .toolbar strong { font-size: 1.05rem; }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: end;
    }

    .primary { background: #243043; color: #fff; }
    .soft { background: #f1f5f9; }
    .success { background: #dcfce7; color: #166534; }

    .screen {
      display: none;
      padding: 16px;
    }

    .screen.active { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    #problemsGrid {
      grid-template-columns: 1fr;
    }

    .exercise {
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 150px;
      display: grid;
      gap: 12px;
      align-content: start;
      background: #fff;
    }

    .prompt {
      font-size: clamp(1.3rem, 4vw, 2.1rem);
      font-weight: 950;
      line-height: 1.15;
    }

    .small-prompt {
      font-size: clamp(1.05rem, 3vw, 1.45rem);
      font-weight: 900;
      line-height: 1.28;
    }

    .num {
      display: inline-flex;
      align-items: baseline;
      gap: .02em;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }

    .tens { color: var(--tens); }
    .ones { color: var(--ones); }

    .answer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    input {
      width: 100%;
      min-height: 56px;
      border: 3px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      font-size: 1.55rem;
      font-weight: 950;
      text-align: center;
      background: #fff;
    }

    .feedback {
      min-height: 28px;
      font-weight: 950;
      font-size: 1.05rem;
    }

    .feedback.ok { color: var(--ok); }
    .feedback.bad { color: var(--bad); }

    .keypad {
      position: sticky;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      padding: 12px;
      background: rgba(255, 248, 237, .96);
      border-top: 2px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .keypad button {
      min-height: 54px;
      background: #fff;
      border: 2px solid var(--line);
      font-size: 1.25rem;
    }

    .keypad .wide { grid-column: span 2; }

    .word-bank, .order-zone {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      border: 2px solid #d1d5db;
      background: #fff;
      min-height: 48px;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 950;
    }

    .pill.selected {
      border-color: var(--focus);
      background: #f3e8ff;
    }

    .symbol-row, .choice-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .symbol-button, .choice-button {
      background: #fff;
      border: 2px solid var(--line);
      font-size: 1.2rem;
      text-align: left;
    }

    .symbol-button {
      min-width: 84px;
      text-align: center;
      font-size: 2rem;
    }

    .symbol-button.selected, .choice-button.selected {
      border-color: var(--focus);
      background: #f3e8ff;
    }

    .symbol-button.correct, .choice-button.correct {
      border-color: var(--ok);
      background: #dcfce7;
      color: #166534;
    }

    .symbol-button.wrong, .choice-button.wrong {
      border-color: var(--bad);
      background: #fee2e2;
      color: #991b1b;
    }

    .place-table {
      display: grid;
      grid-template-columns: repeat(2, minmax(86px, 1fr));
      width: min(360px, 100%);
      border: 3px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      font-weight: 950;
      text-align: center;
    }

    .place-table div {
      min-height: 54px;
      display: grid;
      place-items: center;
      border-right: 2px solid #334155;
      border-bottom: 2px solid #334155;
      font-size: 1.35rem;
    }

    .place-table div:nth-child(2n) { border-right: 0; }
    .place-table div:nth-last-child(-n+2) { border-bottom: 0; }
    .place-table .head { background: #f8fafc; font-size: 1rem; }

    .problem-layout {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
      align-items: center;
    }

    .problem-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      border-radius: 999px;
      padding: 5px 10px;
      background: #ecfdf5;
      color: #166534;
      font-size: .9rem;
      font-weight: 950;
    }

    .problem-history {
      margin-top: 12px;
      border-top: 2px solid var(--line);
      padding-top: 12px;
      display: grid;
      gap: 8px;
    }

    .history-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .history-item {
      text-align: left;
      background: #fff;
      border: 2px solid var(--line);
      max-width: 220px;
      min-height: 54px;
      line-height: 1.2;
    }

    .history-item.active {
      border-color: var(--focus);
      background: #f3e8ff;
    }

    .muted-text {
      color: var(--muted);
      font-size: .86rem;
      font-weight: 800;
    }

    .visual {
      min-height: 150px;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      gap: 8px;
      align-content: center;
      background: #f8fafc;
    }

    .object-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .object, .counter {
      appearance: none;
      width: 24px;
      height: 24px;
      min-height: 24px;
      border-radius: 50%;
      background: var(--ones);
      border: 2px solid #a16207;
      padding: 0;
      position: relative;
    }

    .object.green {
      background: #86efac;
      border-color: #16a34a;
    }

    .object.muted {
      background: #e5e7eb;
      border-color: #94a3b8;
    }

    .object.marked, .counter.marked {
      outline: 4px solid rgba(124, 58, 237, .28);
      transform: scale(1.08);
    }

    .object.crossed, .counter.crossed {
      opacity: .62;
      background: #e5e7eb;
      border-color: #64748b;
    }

    .object.crossed::after, .counter.crossed::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 4px;
      left: -5px;
      top: 8px;
      border-radius: 999px;
      background: #dc2626;
      transform: rotate(-35deg);
    }

    .groups {
      min-height: 140px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .group {
      border: 2px solid #94a3b8;
      border-radius: 8px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      align-content: center;
    }

    .counter {
      margin: auto;
      background: #22c55e;
    }

    .number-line {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      align-items: end;
      font-weight: 950;
      text-align: center;
    }

    .step {
      border-top: 5px solid var(--tens);
      padding-top: 6px;
      color: var(--ink);
    }

    .line-point {
      background: #fff;
      border: 2px solid var(--line);
      min-height: 42px;
      padding: 6px;
    }

    .line-point.marked {
      border-color: var(--focus);
      background: #f3e8ff;
    }

    .clock-area {
      display: grid;
      grid-template-columns: minmax(220px, 310px) 1fr;
      gap: 18px;
      align-items: center;
    }

    .time-context {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-weight: 950;
    }

    .sky-icon {
      width: 24px;
      height: 24px;
      display: inline-block;
      position: relative;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .sky-icon.day {
      background: #facc15;
      box-shadow: 0 0 0 5px rgba(250, 204, 21, .2);
    }

    .sky-icon.night {
      background: #334155;
    }

    .sky-icon.night::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      right: -2px;
      top: 2px;
      border-radius: 50%;
      background: #fff;
    }

    .clock-face {
      width: min(310px, 100%);
      aspect-ratio: 1;
      display: block;
      margin: 0 auto;
    }

    .clock-number {
      font: 900 13px ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      fill: var(--ink);
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .hand-hour {
      stroke: var(--tens);
      stroke-width: 8;
      stroke-linecap: round;
    }

    .hand-minute {
      stroke: var(--ones);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .time-answer {
      display: grid;
      grid-template-columns: minmax(82px, 1fr) auto minmax(82px, 1fr);
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      max-width: 360px;
    }

    .time-answer input {
      min-height: 64px;
      font-size: 1.8rem;
    }

    .time-separator {
      font-size: 2rem;
      font-weight: 950;
      color: var(--ink);
    }

    .sorting-visual {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .token-bank, .cartons {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }

    .token-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      min-height: 76px;
    }

    .cartons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .carton {
      min-height: 82px;
      border: 3px solid #94a3b8;
      border-radius: 8px;
      background: #f8fafc;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-content: flex-start;
      justify-content: center;
    }

    .carton.selected {
      border-color: var(--focus);
      background: #f3e8ff;
    }

    .carton.full {
      border-color: var(--ok);
      background: #dcfce7;
    }

    .carton-token {
      cursor: pointer;
    }

    [data-sort-token].selected {
      outline: 4px solid rgba(124, 58, 237, .35);
      transform: scale(1.1);
    }

    .written-board {
      display: grid;
      grid-template-columns: 44px 74px 74px;
      width: 192px;
      border: 3px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .written-board span,
    .written-board input {
      min-height: 48px;
      display: grid;
      place-items: center;
      border-right: 2px solid #334155;
      border-bottom: 2px solid #334155;
      font-size: 1.7rem;
      font-weight: 950;
      border-radius: 0;
      padding: 0;
      text-align: center;
    }

    .written-board .col-end { border-right: 0; }

    .written-board .last-row { border-bottom: 0; }
    .written-board input {
      width: 100%;
      background: #fffef0;
      color: var(--ink);
      border-top: 0;
      border-left: 0;
    }

    .written-board input:focus-visible {
      outline: 4px solid rgba(124, 58, 237, .3);
      outline-offset: -4px;
    }

    .rule {
      grid-column: 1 / -1;
      min-height: 8px;
      background: #334155;
      border: 0;
    }

    .operator {
      color: #475569;
      background: #f8fafc;
    }

    @media (max-width: 760px) {
      .app { padding: 10px; }
      header { grid-template-columns: 1fr; }
      nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
      .toolbar { align-items: start; flex-direction: column; }
      .toolbar-actions { justify-content: start; }
      .answer-row { grid-template-columns: 1fr; }
      .keypad { grid-template-columns: repeat(5, 1fr); }
      .keypad .wide { grid-column: span 2; }
      .problem-layout { grid-template-columns: 1fr; }
      .groups { grid-template-columns: repeat(2, 1fr); }
      .history-item { max-width: 100%; }
      .clock-area { grid-template-columns: 1fr; }
      .clock-face { width: min(240px, 100%); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Exercices de nombres</h1>
        <div class="legend" aria-label="Légende des couleurs">
          <span class="chip"><span class="dot tens"></span>dizaines</span>
          <span class="chip"><span class="dot ones"></span>unités</span>
        </div>
      </div>
      <button class="primary" id="resetProgress" type="button">Recommencer</button>
    </header>

    <nav aria-label="Choisir un exercice">
      <button class="active" data-screen="mental" type="button">Calcul</button>
      <button data-screen="order" type="button">Ranger</button>
      <button data-screen="problems" type="button">Problèmes</button>
      <button data-screen="written" type="button">Poser</button>
      <button data-screen="hours" type="button">Heures</button>
      <button data-screen="reading" type="button">Lecture</button>
    </nav>

    <main>
      <section class="screen active" id="mental">
        <div class="toolbar">
          <strong>Calcule dans ta tête</strong>
          <div class="toolbar-actions">
            <button class="soft" data-check-screen="mental" type="button">Corriger</button>
            <button class="success" data-new="mental" type="button">Nouvelle série</button>
          </div>
        </div>
        <div class="grid" id="mentalGrid"></div>
      </section>

      <section class="screen" id="order">
        <div class="toolbar">
          <strong>Touche les nombres du plus petit au plus grand</strong>
          <div class="toolbar-actions">
            <button class="soft" id="undoOrder" type="button">Effacer le dernier</button>
            <button class="soft" data-check-screen="order" type="button">Corriger</button>
            <button class="success" data-new="order" type="button">Nouvelle série</button>
          </div>
        </div>
        <div class="exercise">
          <div class="small-prompt">Nombres à ranger</div>
          <div class="word-bank" id="orderBank"></div>
          <div class="small-prompt">Ma réponse</div>
          <div class="order-zone" id="orderAnswer"></div>
          <div class="feedback" id="orderFeedback"></div>
        </div>
      </section>

      <section class="screen" id="problems">
        <div class="toolbar">
          <strong>Résous le problème</strong>
          <div class="toolbar-actions">
            <button class="soft" data-check-screen="problems" type="button">Corriger</button>
            <button class="success" data-new="problems" type="button">Nouveau problème</button>
            <button class="soft" id="clearProblemHistory" type="button">Vider l'historique</button>
          </div>
        </div>
        <div class="grid" id="problemsGrid"></div>
        <div class="problem-history">
          <div class="small-prompt">Historique des problèmes vus</div>
          <div class="history-list" id="problemHistory"></div>
        </div>
      </section>

      <section class="screen" id="written">
        <div class="toolbar">
          <strong>Pose et calcule avec d et u</strong>
          <div class="toolbar-actions">
            <button class="soft" data-check-screen="written" type="button">Corriger</button>
            <button class="success" data-new="written" type="button">Nouvelle série</button>
          </div>
        </div>
        <div class="grid" id="writtenGrid"></div>
      </section>

      <section class="screen" id="hours">
        <div class="toolbar">
          <strong>Lis l'heure avec les aiguilles</strong>
          <div class="toolbar-actions">
            <button class="soft" data-check-screen="hours" type="button">Corriger</button>
            <button class="success" data-new="hours" type="button">Nouvelle heure</button>
          </div>
        </div>
        <div id="hoursGrid"></div>
      </section>

      <section class="screen" id="reading">
        <div class="toolbar">
          <strong>Lecture</strong>
          <div class="toolbar-actions">
            <button class="soft" data-check-screen="reading" type="button">Corriger</button>
            <button class="success" data-new="reading" type="button">Nouvel exercice</button>
          </div>
        </div>
        <div id="readingGrid"></div>
      </section>
    </main>

    <div class="keypad" aria-label="Clavier tactile">
      <button data-key="1" type="button">1</button>
      <button data-key="2" type="button">2</button>
      <button data-key="3" type="button">3</button>
      <button data-key="4" type="button">4</button>
      <button data-key="5" type="button">5</button>
      <button data-key="6" type="button">6</button>
      <button data-key="7" type="button">7</button>
      <button data-key="8" type="button">8</button>
      <button data-key="9" type="button">9</button>
      <button data-key="0" type="button">0</button>
      <button class="wide" data-key="back" type="button">Effacer</button>
      <button class="wide" data-key="clear" type="button">Vider</button>
      <button class="wide primary" data-key="next" type="button">Suivant</button>
    </div>
  </div>

  <script>
    const sets = {
      mental: [
        [[54, "+", 10], [66, "+", 20], [57, "-", 20], [35, "+", 20], [68, "-", 10], [81, "-", 10]],
        [[46, "+", 30], [75, "-", 10], [49, "-", 30], [72, "-", 20], [35, "+", 30], [23, "+", 40]],
        [[63, "+", 10], [75, "+", 10], [49, "+", 30], [35, "-", 10], [79, "-", 10], [54, "-", 20]],
        [
          { left: 35, op: "+", right: null, result: 75, answer: 40 },
          { left: 42, op: "+", right: null, result: 72, answer: 30 },
          { left: 18, op: "+", right: null, result: 98, answer: 80 },
          { left: null, op: "+", right: 20, result: 70, answer: 50 },
          { left: 90, op: "-", right: null, result: 20, answer: 70 },
          { left: 86, op: "-", right: null, result: 56, answer: 30 }
        ],
        [
          { left: 14, op: "+", right: null, result: 94, answer: 80 },
          { left: 27, op: "+", right: null, result: 57, answer: 30 },
          { left: 60, op: "-", right: null, result: 10, answer: 50 },
          { left: 100, op: "-", right: null, result: 20, answer: 80 },
          { left: null, op: "-", right: 30, result: 40, answer: 70 },
          { left: null, op: "-", right: 20, result: 60, answer: 80 }
        ],
        [
          { left: 23, op: "+", right: null, result: 93, answer: 70 },
          { left: 8, op: "+", right: null, result: 98, answer: 90 },

    function colorNumber(value) {
      const text = String(value);
      if (text.length === 1) return `<span class="num"><span class="ones">${text}</span></span>`;
      return `<span class="num"><span class="tens">${text.slice(0, -1)}</span><span class="ones">${text.slice(-1)}</span></span>`;
    }

    function answerFor(item) {
      if (!Array.isArray(item)) return item.answer;
      if (Array.isArray(item)) {
        const [a, op, b] = item;
        return op === "+" ? a + b : a - b;
      }
      return item.answer !== undefined ? item.answer : item;
    }

    function pad2(value) {
      const text = String(value);
      return text.length < 2 ? "0" + text : text;
    }

    function setClass(element, className, enabled) {
      if (!element) return;
      if (enabled) {
        element.classList.add(className);
      } else {
        element.classList.remove(className);
      }
    }

    function clearAutoAdvance() {
      if (state.advanceTimer) {
        clearTimeout(state.advanceTimer);
        state.advanceTimer = null;
      }
    }

    function scheduleNext(id) {
      clearAutoAdvance();
      state.advanceTimer = setTimeout(function() {
        const active = document.querySelector(".screen.active");
        if (active && active.id === id) {
          nextSet(id);
        }
      }, 1100);
    }

    function allFeedbackOk(selector) {
      const feedbacks = Array.prototype.slice.call(document.querySelectorAll(selector));
      return feedbacks.length > 0 && feedbacks.every(function(feedback) {
        return feedback.classList.contains("ok");
      });
    }

    function allInputsCorrect(selector) {
      const inputs = Array.prototype.slice.call(document.querySelectorAll(selector));
      return inputs.length > 0 && inputs.every(function(input) {
        return input.value.trim() !== "" && Number(input.value) === Number(input.dataset.expected);
      });
    }

    function allWrittenBoardsCorrect() {
      const boards = Array.prototype.slice.call(document.querySelectorAll("#written .written-board"));
      return boards.length > 0 && boards.every(function(board) {
        const exercise = board.closest(".exercise");
        const expected = pad2(board.dataset.expected);
        const actual = Array.prototype.slice.call(exercise.querySelectorAll(".written-digit")).map(function(input) {
          return input.value;
        }).join("");
        return actual === expected;
      });
    }

    function dots(count, className = "") {
      return Array.from({ length: count }, (_, index) =>
        `<button class="object ${className}" data-markable type="button" aria-label="Jeton ${index + 1}"></button>`
      ).join("");

    function renderProblemVisual(problem) {
      const visual = problem.visual;
      if (visual.type === "twoRows") {
        return `<div class="visual" aria-label="Dessin du problème">
          <div class="object-row">${dots(visual.first, "green")}</div>
          <div class="object-row">${dots(visual.second)}</div>
        </div>`;
      }
      if (visual.type === "takeAway") {
        return `<div class="visual" aria-label="Dessin du problème">
          <div class="object-row">${dots(visual.total - visual.away, "green")}${dots(visual.away, "muted")}</div>
        </div>`;
      }
      if (visual.type === "complete") {
        return `<div class="visual" aria-label="Dessin du problème">
          <div class="object-row">${dots(visual.have, "green")}${dots(visual.target - visual.have, "muted")}</div>
        </div>`;
      }
      if (visual.type === "groups") {
        const total = visual.groups * visual.each;
        const reserve = Array.from({ length: total }, (_, index) =>
          `<button class="counter" data-sort-token="${index + 1}" type="button" aria-label="Jeton ${index + 1}"></button>`
        ).join("");
        const cartons = Array.from({ length: visual.groups }, (_, index) =>
          `<button class="carton" data-carton="${index + 1}" data-capacity="${visual.each}" type="button" aria-label="Carton ${index + 1}"></button>`
        ).join("");
        return `<div class="visual sorting-visual" aria-label="Dessin du problème">
          <div class="token-bank" aria-label="Jetons à ranger">${reserve}</div>
          <div class="cartons" aria-label="Cartons à remplir">${cartons}</div>
        </div>`;
      }
      if (visual.type === "compare") {
        return `<div class="visual" aria-label="Dessin du problème">
          <div class="object-row">${dots(visual.first, "green")}</div>
          <div class="object-row">${dots(visual.second)}</div>
        </div>`;
      }
      if (visual.type === "line") {
        const middle = visual.jump > 0 ? `+${visual.jump}` : String(visual.jump);
        return `<div class="visual" aria-label="Dessin du problème">
          <div class="number-line">
            <button class="line-point" data-line-point type="button">${visual.start}</button>
            <button class="line-point step" data-line-point type="button">${middle}</button>
            <span></span>
            <span></span>
            <span class="step">=</span>
            <button class="line-point" data-line-point type="button">${visual.end}</button>
          </div>
        </div>`;
      }
      return `<div class="visual" aria-label="Dessin du problème"></div>`;
    }

    function clockSvg(hour, minute) {
      const hourAngle = ((hour % 12) * 30) + (minute * 0.5);
      const minuteAngle = minute * 6;
      const numbers = Array.from({ length: 12 }, (_, index) => {
        const value = index + 1;
        const angle = (value * 30 - 90) * Math.PI / 180;
        const x = 100 + Math.cos(angle) * 76;
        const y = 100 + Math.sin(angle) * 76;
        return `<text class="clock-number" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${value}</text>`;
      }).join("");
      const ticks = Array.from({ length: 60 }, (_, index) => {
        const angle = (index * 6 - 90) * Math.PI / 180;
        const outer = 92;
        const inner = index % 5 === 0 ? 84 : 88;
        const x1 = 100 + Math.cos(angle) * outer;
        const y1 = 100 + Math.sin(angle) * outer;
        const x2 = 100 + Math.cos(angle) * inner;
        const y2 = 100 + Math.sin(angle) * inner;
        return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#94a3b8" stroke-width="${index % 5 === 0 ? 2 : 1}"/>`;
      }).join("");
      return `<svg class="clock-face" viewBox="0 0 200 200" role="img" aria-label="Horloge à aiguilles">
        <circle cx="100" cy="100" r="96" fill="#fff" stroke="#334155" stroke-width="4"/>
        ${ticks}
        ${numbers}
        <line class="hand-hour" x1="100" y1="100" x2="100" y2="48" transform="rotate(${hourAngle} 100 100)"/>
        <line class="hand-minute" x1="100" y1="100" x2="100" y2="28" transform="rotate(${minuteAngle} 100 100)"/>
        <circle cx="100" cy="100" r="6" fill="#243043"/>
      </svg>`;
    }

    function checkInput(input) {
      if (input.dataset.kind === "written-digit") {
        return checkWrittenBoard(input.closest(".exercise"));

      setFeedback(input, ok);
      if (ok && input.dataset.kind === "mental" && allInputsCorrect("#mental input")) {
        scheduleNext("mental");

      if (ok && input.dataset.kind === "problems") {
        scheduleNext("problems");
      }
      return ok;

        const exercise = input.closest(".exercise");
        const digits = [...exercise.querySelectorAll(".written-digit")];
        const complete = digits.every(function(digit) { return digit.value.length === 1; });
        if (complete) checkWrittenBoard(exercise);
        return;
      }
      if (input.dataset.kind === "time-hour" || input.dataset.kind === "time-minute") {
        const hourInput = document.querySelector('[data-kind="time-hour"]');
        const minuteInput = document.querySelector('[data-kind="time-minute"]');
        if (hourInput && minuteInput && hourInput.value.length > 0 && minuteInput.value.length === 2) {
          checkHours();
        }
        return;
      }
      if (input.dataset.kind !== "mental" && input.dataset.kind !== "problems") return;
      const expected = String(input.dataset.expected);
      if (input.value.length === expected.length) {
        checkInput(input);
      }
    }

    function checkWrittenBoard(exercise) {
      const inputs = [...exercise.querySelectorAll(".written-digit")];
      const expected = pad2(exercise.querySelector(".written-board").dataset.expected);
      const actual = inputs.map(input => input.value).join("");
      const ok = actual.length === 2 && actual === expected;
      const feedback = exercise.querySelector(".feedback");
      feedback.textContent = ok ? "Bravo !" : "Essaie encore";
      feedback.className = `feedback ${ok ? "ok" : "bad"}`;
      inputs.forEach((input, index) => {
        input.style.borderColor = input.value === expected[index] ? "var(--ok)" : "var(--bad)";
      });
      if (ok && allWrittenBoardsCorrect()) {
        scheduleNext("written");
      }
      return ok;
    }

    function checkScreen(id) {
      if (id === "order") return checkOrder();
      if (id === "hours") return checkHours();
      if (id === "reading") return checkReading();
      if (id === "written") {
        document.querySelectorAll("#written .exercise").forEach(checkWrittenBoard);
        return;
      }
      document.querySelectorAll(`#${id} input`).forEach(checkInput);
    }

    function checkOrder() {
      const task = sets.order[state.index.order];
      const feedback = document.querySelector("#orderFeedback");
      if (task.mode === "compare") {
        const expected = task.left < task.right ? "lt" : "gt";
        const buttons = document.querySelectorAll("[data-compare]");
        buttons.forEach(function(button) {
          setClass(button, "correct", button.dataset.compare === expected);
          setClass(button, "wrong", button.classList.contains("selected") && button.dataset.compare !== expected);
        });
        const ok = state.selectedCompare === expected;
        feedback.textContent = ok ? "Bravo !" : "Regarde quel nombre est le plus grand";
        feedback.className = `feedback ${ok ? "ok" : "bad"}`;
        if (ok) scheduleNext("order");
        return;
      }
      const expectedValues = [...task.values].sort((a, b) => task.mode === "desc" ? b - a : a - b);
      const expected = expectedValues.join(",");
      const actual = state.orderAnswer.join(",");
      const ok = expected === actual;
      feedback.textContent = ok ? "Bravo !" : task.mode === "desc" ? "Regarde le nombre le plus grand qui reste" : "Regarde le nombre le plus petit qui reste";
      feedback.className = `feedback ${ok ? "ok" : "bad"}`;
      if (ok) scheduleNext("order");
    }

    function checkHours() {
      const target = sets.hours[state.index.hours];
      const feedback = document.querySelector("#hoursFeedback");
      const hourInput = document.querySelector('[data-kind="time-hour"]');
      const minuteInput = document.querySelector('[data-kind="time-minute"]');
      const hour = Number(hourInput.value);
      const minute = Number(pad2(minuteInput.value));
      const ok = hour === target.hour && minute === target.minute && minuteInput.value.trim() !== "";
      hourInput.style.borderColor = hour === target.hour ? "var(--ok)" : "var(--bad)";
      minuteInput.style.borderColor = minute === target.minute && minuteInput.value.trim() !== "" ? "var(--ok)" : "var(--bad)";
      feedback.textContent = ok ? "Bravo !" : `Essaie encore : écris les minutes avec deux chiffres`;
      feedback.className = `feedback ${ok ? "ok" : "bad"}`;
      if (ok) scheduleNext("hours");
    }

    function checkReading() {
      const task = sets.reading[state.index.reading];
      const feedback = document.querySelector("#readingFeedback");
      document.querySelectorAll("[data-reading-choice]").forEach(button => {
        setClass(button, "correct", button.dataset.readingChoice === task.answer);
        setClass(button, "wrong", button.classList.contains("selected") && button.dataset.readingChoice !== task.answer);
      });
      const ok = state.selectedReading === task.answer;
      feedback.textContent = ok ? "Bravo !" : "Relis doucement la phrase";
      feedback.className = `feedback ${ok ? "ok" : "bad"}`;
      if (ok) scheduleNext("reading");
    }

    function nextSet(id) {
      clearAutoAdvance();
      if (id === "problems") {
        const recent = new Set(state.problemHistory.slice(0, 4));
        let candidates = sets.problems
          .map((problem, index) => ({ problem, index }))
          .filter(item => !recent.has(item.problem.id));
        if (!candidates.length) {
          candidates = sets.problems
            .map((problem, index) => ({ problem, index }))
            .filter(item => index !== state.index.problems);
        }
        const chosen = candidates[Math.floor(Math.random() * candidates.length)];
        state.index.problems = chosen.index;
        renderProblems();
        wireInputs();
        var problemInput = document.querySelector("#problems input");
        if (problemInput) problemInput.focus();
        return;
      }
      if (id === "hours") {
        let next = state.index.hours;
        while (next === state.index.hours && sets.hours.length > 1) {
          next = Math.floor(Math.random() * sets.hours.length);
        }
        state.index.hours = next;
        renderHours();
        wireInputs();
        return;
      }
      if (id === "order" || id === "reading" || id === "mental" || id === "written") {
        let next = state.index[id];
        while (next === state.index[id] && sets[id].length > 1) {
          next = Math.floor(Math.random() * sets[id].length);
        }
        state.index[id] = next;
        renderAll();
        return;
      }
      state.index[id] = (state.index[id] + 1) % sets[id].length;
      renderAll();
      const screen = document.querySelector(`#${id}`);
      const firstInput = screen.querySelector("input");
      if (firstInput) firstInput.focus();
    }

    function renderAll() {
      renderMental();
      renderOrder();
      renderProblems();
      renderWritten();
      renderHours();
      renderReading();
      wireInputs();
      updateKeypadVisibility();
    }

    function updateKeypadVisibility() {
    }

    function wireInputs() {
      document.querySelectorAll("input").forEach(input => {
        input.addEventListener("focus", () => { state.activeInput = input; });
        input.addEventListener("click", () => { state.activeInput = input; });
        input.addEventListener("touchstart", () => { state.activeInput = input; });
        input.addEventListener("input", () => {
          const maxLength = input.dataset.kind === "written-digit" ? 1 : 2;
          input.value = input.value.replace(/\D/g, "").slice(0, maxLength);
          input.style.borderColor = "#d1d5db";
          const feedback = input.closest(".exercise").querySelector(".feedback");
          feedback.textContent = "";
          feedback.className = "feedback";
          maybeAutoCheckInput(input);
        });
      });
      document.querySelectorAll(".check-one").forEach(button => {
        button.addEventListener("click", () => checkInput(button.parentElement.querySelector("input")));
      });
      document.querySelectorAll("[data-order-value]").forEach(button => {
        button.addEventListener("click", () => {
          if (button.classList.contains("selected")) return;
          const value = Number(button.dataset.orderValue);
          button.classList.add("selected");
          state.orderAnswer.push(value);
          document.querySelector("#orderAnswer").insertAdjacentHTML("beforeend", `<span class="pill">${colorNumber(value)}</span>`);
          const task = sets.order[state.index.order];
          if (task.mode !== "compare" && state.orderAnswer.length === task.values.length) {
            checkOrder();
          }
        });
      });
      document.querySelectorAll("[data-compare]").forEach(button => {
        button.addEventListener("click", () => {
          state.selectedCompare = button.dataset.compare;
          document.querySelectorAll("[data-compare]").forEach(item => item.classList.remove("selected", "correct", "wrong"));
          button.classList.add("selected");
          const display = document.querySelector("#compareDisplay");
          if (display) {
            display.textContent = button.dataset.compare === "lt" ? "<" : ">";
            display.classList.remove("muted-text");
          }
          checkOrder();
        });
      });
      document.querySelectorAll("[data-reading-choice]").forEach(button => {
        button.addEventListener("click", () => {
          state.selectedReading = button.dataset.readingChoice;
          document.querySelectorAll("[data-reading-choice]").forEach(item => item.classList.remove("selected", "correct", "wrong"));
          button.classList.add("selected");
          checkReading();
        });
      });
      document.querySelectorAll("[data-problem-id]").forEach(button => {
        button.addEventListener("click", () => {
          const index = sets.problems.findIndex(problem => problem.id === button.dataset.problemId);
          if (index === -1) return;
          state.index.problems = index;
          renderProblems();
          wireInputs();
          var problemInput = document.querySelector("#problems input");
          if (problemInput) problemInput.focus();
        });
      });
      document.querySelectorAll("[data-markable]").forEach(button => {
        button.addEventListener("click", () => {
          if (!button.classList.contains("marked") && !button.classList.contains("crossed")) {
            button.classList.add("marked");
            return;
          }
          if (button.classList.contains("marked")) {
            button.classList.remove("marked");
            button.classList.add("crossed");
            return;
          }
          button.classList.remove("crossed");
        });
      });
      document.querySelectorAll("[data-sort-token]").forEach(button => {
        button.addEventListener("click", () => {
          const sortingVisual = button.closest(".sorting-visual");
          const bank = sortingVisual ? sortingVisual.querySelector(".token-bank") : null;
          if (button.closest(".carton") && bank) {
            bank.appendChild(button);
            button.classList.remove("selected", "marked", "crossed");
            updateCartons(button.closest(".sorting-visual"));
            return;
          }
          document.querySelectorAll("[data-sort-token]").forEach(item => item.classList.remove("selected"));
          button.classList.add("selected");
        });
      });
      document.querySelectorAll("[data-carton]").forEach(carton => {
        carton.addEventListener("click", () => {
          const visual = carton.closest(".sorting-visual");
          const selected = visual.querySelector("[data-sort-token].selected");
          if (!selected) {
            carton.classList.toggle("selected");
            return;
          }
          const capacity = Number(carton.dataset.capacity);
          const current = carton.querySelectorAll("[data-sort-token]").length;
          if (current >= capacity) return;
          selected.classList.remove("selected");
          selected.classList.add("carton-token");
          carton.appendChild(selected);
          updateCartons(visual);
        });
      });
      document.querySelectorAll("[data-line-point]").forEach(button => {
        button.addEventListener("click", () => button.classList.toggle("marked"));
      });
    }

    function updateCartons(visual) {
      visual.querySelectorAll("[data-carton]").forEach(carton => {
        const capacity = Number(carton.dataset.capacity);
        const current = carton.querySelectorAll("[data-sort-token]").length;
        setClass(carton, "full", current === capacity);
        carton.classList.remove("selected");
      });
    }

    document.querySelectorAll("nav button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("nav button").forEach(item => item.classList.remove("active"));
        document.querySelectorAll(".screen").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        document.querySelector(`#${button.dataset.screen}`).classList.add("active");
        state.activeInput = document.querySelector(".screen.active input");
        if (state.activeInput) state.activeInput.focus();
        updateKeypadVisibility();
      });
    });

    document.querySelectorAll("[data-check-screen]").forEach(button => {
      button.addEventListener("click", () => checkScreen(button.dataset.checkScreen));
    });

    document.querySelectorAll("[data-new]").forEach(button => {
      button.addEventListener("click", () => nextSet(button.dataset.new));
    });

    document.querySelector("#undoOrder").addEventListener("click", () => {
      const removed = state.orderAnswer.pop();
      if (removed === undefined) return;
      const restoredButton = document.querySelector(`#orderBank [data-order-value="${removed}"]`);
      if (restoredButton) restoredButton.classList.remove("selected");
      const lastAnswer = document.querySelector("#orderAnswer").lastElementChild;
      if (lastAnswer) lastAnswer.remove();
    });

    document.querySelector("#clearProblemHistory").addEventListener("click", () => {
      state.problemHistory = [];
      localStorage.removeItem("problemHistory");
      renderProblemHistory();
    });

    document.querySelector("#resetProgress").addEventListener("click", () => {
      Object.keys(state.index).forEach(key => { state.index[key] = 0; });
      renderAll();
    });

    document.querySelectorAll("[data-key]").forEach(button => {
      button.addEventListener("click", () => {
        const activeScreen = document.querySelector(".screen.active");
        const focusedInput = document.activeElement && document.activeElement.tagName === "INPUT" && activeScreen && activeScreen.contains(document.activeElement) ? document.activeElement : null;
        const activeInputIsUsable = state.activeInput && state.activeInput.isConnected && activeScreen && activeScreen.contains(state.activeInput);
        const input = focusedInput ? focusedInput : activeInputIsUsable ? state.activeInput : activeScreen ? activeScreen.querySelector("input") : null;
        if (!input) return;
        state.activeInput = input;
        input.focus();
        const key = button.dataset.key;
        const maxLength = input.dataset.kind === "written-digit" ? 1 : 2;
        if (/^\d$/.test(key)) input.value = (input.value + key).slice(0, maxLength);
        if (key === "back") input.value = input.value.slice(0, -1);
        if (key === "clear") input.value = "";
        if (key === "next") {
          const inputs = [...document.querySelectorAll(".screen.active input")];
          const next = inputs[(inputs.indexOf(input) + 1) % inputs.length];
          if (next) {
            state.activeInput = next;
            next.focus();
          }
          return;
        }
        input.dispatchEvent(new Event("input"));
      });
    });

    renderAll();
  </script>
</body>
</html>
