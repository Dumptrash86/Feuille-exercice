<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feuille d'exercices interactive</title>
  <style>
    :root {
      --bg: #fff8ed;
      --ink: #243043;
      --muted: #6b7280;
      --panel: #ffffff;
      --line: #e5ded2;
      --tens: #16a34a;
      --ones: #eab308;
      --ones-ink: #a16207;
      --ok: #16a34a;
      --bad: #dc2626;
      --focus: #7c3aed;
      --shadow: 0 14px 36px rgba(36, 48, 67, .12);
      font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(22, 163, 74, .08) 1px, transparent 1px) 0 0 / 34px 34px,
        linear-gradient(rgba(234, 179, 8, .1) 1px, transparent 1px) 0 0 / 34px 34px,
        var(--bg);
      min-height: 100vh;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 { margin: 0; font-size: clamp(1.45rem, 3vw, 2.25rem); line-height: 1.1; }

    .legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-weight: 800; }

    .chip { display: inline-flex; align-items: center; gap: 7px; border: 2px solid var(--line); border-radius: 999px; background: #fff; padding: 8px 12px; font-size: .95rem; }

    .dot { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
    .dot.tens { background: var(--tens); }
    .dot.ones { background: var(--ones); }

    nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 8px 0 14px; }

    button { appearance: none; border: 0; border-radius: 8px; background: #eef2ff; color: var(--ink); min-height: 48px; padding: 10px 12px; font: inherit; font-weight: 900; cursor: pointer; touch-action: manipulation; }

    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible { outline: 4px solid rgba(124, 58, 237, .3); outline-offset: 2px; }
    nav button.active { background: var(--focus); color: #fff; }

    main { background: var(--panel); border: 2px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px; border-bottom: 2px solid var(--line); background: #fffbf5; }
    .toolbar strong { font-size: 1.05rem; }
    .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: end; }

    .primary { background: #243043; color: #fff; }
    .soft { background: #f1f5f9; }
    .success { background: #dcfce7; color: #166534; }

    .screen { display: none; padding: 16px; }
    .screen.active { display: block; }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

    .exercise { border: 2px solid var(--line); border-radius: 8px; padding: 14px; min-height: 150px; display: grid; gap: 12px; align-content: start; background: #fff; }

    .prompt { font-size: clamp(1.3rem, 4vw, 2.1rem); font-weight: 950; line-height: 1.15; }
    .small-prompt { font-size: clamp(1.05rem, 3vw, 1.45rem); font-weight: 900; line-height: 1.28; }

    .num { display: inline-flex; align-items: baseline; gap: .02em; letter-spacing: 0; font-variant-numeric: tabular-nums; }
    .tens { color: var(--tens); }
    .ones { color: var(--ones-ink); }

    .answer-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }

    input { width: 100%; min-height: 56px; border: 3px solid #d1d5db; border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 1.55rem; font-weight: 950; text-align: center; background: #fff; }

    .feedback { min-height: 28px; font-weight: 950; font-size: 1.05rem; }
    .feedback.ok { color: var(--ok); animation: pop .35s ease; }
    .feedback.bad { color: var(--bad); }

    @keyframes pop { 0% { transform: scale(0.8); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .feedback.ok { animation: none; } }

    .keypad { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 12px; background: rgba(255, 248, 237, .96); border-top: 2px solid var(--line); backdrop-filter: blur(8px); }
    .keypad button { min-height: 54px; background: #fff; border: 2px solid var(--line); font-size: 1.25rem; }
    .keypad .wide { grid-column: span 2; }

    .word-bank, .order-zone { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { border: 2px solid #d1d5db; background: #fff; min-height: 48px; border-radius: 8px; padding: 8px 12px; font-weight: 950; }
    .pill.selected { border-color: var(--focus); background: #f3e8ff; }

    .symbol-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .symbol-button { background: #fff; border: 2px solid var(--line); font-size: 1.2rem; text-align: center; min-width: 84px; font-size: 2rem; }
    .symbol-button.selected { border-color: var(--focus); background: #f3e8ff; }
    .symbol-button.correct { border-color: var(--ok); background: #dcfce7; color: #166534; }
    .symbol-button.wrong { border-color: var(--bad); background: #fee2e2; color: #991b1b; }

    .written-board { display: grid; grid-template-columns: 44px 74px 74px; width: 192px; border: 3px solid #334155; border-radius: 8px; overflow: hidden; background: #fff; }
    .written-board span, .written-board input { min-height: 48px; display: grid; place-items: center; border-right: 2px solid #334155; border-bottom: 2px solid #334155; font-size: 1.7rem; font-weight: 950; border-radius: 0; padding: 0; text-align: center; }
    .written-board .col-end { border-right: 0; }
    .written-board .last-row { border-bottom: 0; }
    .written-board input { width: 100%; background: #fffef0; color: var(--ink); border-top: 0; border-left: 0; }
    .written-board input:focus-visible { outline: 4px solid rgba(124, 58, 237, .3); outline-offset: -4px; }
    .written-board .retenue-cell { border: 0; min-height: 22px; background: transparent; padding: 0; }
    .written-board input.retenue-input { width: 28px; height: 28px; min-height: 28px; border-radius: 50%; border: 2px solid var(--focus); background: #f3e8ff; color: var(--focus); font-size: 1rem; margin: 2px auto 0; padding: 0; }
    .rule { grid-column: 1 / -1; min-height: 8px; background: #334155; border: 0; }
    .operator { color: #475569; background: #f8fafc; }

    .clock-area { display: grid; grid-template-columns: minmax(220px, 310px) 1fr; gap: 18px; align-items: center; }
    .time-context { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 999px; background: #fff; padding: 8px 12px; margin-bottom: 10px; font-weight: 950; }
    .sky-icon { width: 24px; height: 24px; display: inline-block; position: relative; border-radius: 50%; flex: 0 0 auto; }
    .sky-icon.matin { background: #fdba74; box-shadow: 0 0 0 5px rgba(253,186,116,.25); }
    .sky-icon.apresmidi { background: #facc15; box-shadow: 0 0 0 5px rgba(250,204,21,.2); }
    .sky-icon.soir { background: #f97316; box-shadow: 0 0 0 5px rgba(249,115,22,.22); }
    .sky-icon.nuit { background: #334155; }
    .sky-icon.nuit::after { content: ""; position: absolute; width: 18px; height: 18px; right: -2px; top: 2px; border-radius: 50%; background: #fff; }
    .clock-face { width: min(310px, 100%); aspect-ratio: 1; display: block; margin: 0 auto; }
    .clock-number { font: 900 13px ui-rounded, "SF Pro Rounded", system-ui, sans-serif; fill: var(--ink); text-anchor: middle; dominant-baseline: middle; }
    .hand-hour { stroke: var(--tens); stroke-width: 8; stroke-linecap: round; }
    .hand-minute { stroke: var(--ones-ink); stroke-width: 5; stroke-linecap: round; }
    .time-answer { display: grid; grid-template-columns: minmax(82px,1fr) auto minmax(82px,1fr); gap: 8px; align-items: center; margin-top: 12px; max-width: 360px; }
    .time-answer input { min-height: 64px; font-size: 1.8rem; }
    .time-separator { font-size: 2rem; font-weight: 950; color: var(--ink); }

    @media (max-width: 760px) {
      .app { padding: 10px; }
      header { grid-template-columns: 1fr; }
      nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
      .toolbar { align-items: start; flex-direction: column; }
      .toolbar-actions { justify-content: start; }
      .answer-row { grid-template-columns: 1fr; }
      .keypad { grid-template-columns: repeat(5, 1fr); }
      .keypad .wide { grid-column: span 2; }
      .clock-area { grid-template-columns: 1fr; }
      .clock-face { width: min(240px, 100%); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Exercices de nombres</h1>
        <div class="legend" aria-label="Légende des couleurs">
          <span class="chip"><span class="dot tens"></span>dizaines</span>
          <span class="chip"><span class="dot ones"></span>unités</span>
        </div>
      </div>
      <button class="primary" id="resetProgress" type="button">Recommencer</button>
    </header>

    <nav aria-label="Choisir un exercice">
      <button class="active" data-screen="mental" type="button">Calcul</button>
      <button data-screen="order" type="button">Ranger</button>
      <button data-screen="written" type="button">Poser</button>
      <button data-screen="hours" type="button">Heures</button>
    </nav>    <main>
      <section class="screen active" id="mental">
        <div class="toolbar">
          <strong>Calcule dans ta tête</strong>
          <div class="toolbar-actions">
            <button class="soft" data-check-screen="mental" type="button">Corriger</button>
            <button class="success" data-new="mental" type="button">Nouvelle série</button>
          </div>
        </div>
        <div class="grid" id="mentalGrid"></div>
      </section>

      <section class="screen" id="order">
        <div class="toolbar">
          <strong>Touche les nombres du plus petit au plus grand</strong>
          <div class="toolbar-actions">
            <button class="soft" id="undoOrder" type="button">Effacer le dernier</button>
            <button class="soft" data-check-screen="order" type="button">Corriger</button>
            <button class="success" data-new="order" type="button">Nouvelle série</button>
          </div>
        </div>
        <div class="exercise">
          <div class="small-prompt">Nombres à ranger</div>
          <div class="word-bank" id="orderBank"></div>
          <div class="small-prompt">Ma réponse</div>
          <div class="order-zone" id="orderAnswer"></div>
          <div class="feedback" id="orderFeedback"></div>
        </div>
      </section>

      <section class="screen" id="written">
        <div class="toolbar">
          <strong>Pose et calcule avec d et u</strong>
          <div class="toolbar-actions">
            <button class="soft" data-check-screen="written" type="button">Corriger</button>
            <button class="success" data-new="written" type="button">Nouvelle série</button>
          </div>
        </div>
        <div class="grid" id="writtenGrid"></div>
      </section>

      <section class="screen" id="hours">
        <div class="toolbar">
          <strong>Lis l'heure avec les aiguilles</strong>
          <div class="toolbar-actions">
            <button class="soft" data-check-screen="hours" type="button">Corriger</button>
            <button class="success" data-new="hours" type="button">Nouvelle heure</button>
          </div>
        </div>
        <div id="hoursGrid"></div>
      </section>
    </main>

    <div class="keypad" aria-label="Clavier tactile">
      <button data-key="1" type="button">1</button>
      <button data-key="2" type="button">2</button>
      <button data-key="3" type="button">3</button>
      <button data-key="4" type="button">4</button>
      <button data-key="5" type="button">5</button>
      <button data-key="6" type="button">6</button>
      <button data-key="7" type="button">7</button>
      <button data-key="8" type="button">8</button>
      <button data-key="9" type="button">9</button>
      <button data-key="0" type="button">0</button>
      <button class="wide" data-key="back" type="button">Effacer</button>
      <button class="wide" data-key="clear" type="button">Vider</button>
      <button class="wide primary" data-key="next" type="button">Suivant</button>
    </div>
  </div>

  <script>
    const sets = {
      mental: [
        [[54,"+",10],[66,"+",20],[57,"-",20],[35,"+",20],[68,"-",10],[81,"-",10]],
        [[46,"+",30],[75,"-",10],[49,"-",30],[72,"-",20],[35,"+",30],[23,"+",40]],
        [[63,"+",10],[75,"+",10],[49,"+",30],[35,"-",10],[79,"-",10],[54,"-",20]],
        [{left:35,op:"+",right:null,result:75,answer:40},{left:42,op:"+",right:null,result:72,answer:30},{left:18,op:"+",right:null,result:98,answer:80},{left:null,op:"+",right:20,result:70,answer:50},{left:90,op:"-",right:null,result:20,answer:70},{left:86,op:"-",right:null,result:56,answer:30}],
        [{left:14,op:"+",right:null,result:94,answer:80},{left:27,op:"+",right:null,result:57,answer:30},{left:60,op:"-",right:null,result:10,answer:50},{left:100,op:"-",right:null,result:20,answer:80},{left:null,op:"-",right:30,result:40,answer:70},{left:null,op:"-",right:20,result:60,answer:80}],
        [{left:23,op:"+",right:null,result:93,answer:70},{left:8,op:"+",right:null,result:98,answer:90},{left:74,op:"-",right:null,result:34,answer:40},{left:95,op:"-",right:null,result:5,answer:90},{left:null,op:"+",right:40,result:90,answer:50},{left:null,op:"-",right:60,result:20,answer:80}],
        [[12,"+",40],[31,"+",50],[96,"-",60],[84,"-",40],[7,"+",70],[99,"-",90]],
        [{left:55,op:"+",right:null,result:95,answer:40},{left:null,op:"+",right:30,result:80,answer:50},{left:70,op:"-",right:null,result:10,answer:60},{left:null,op:"-",right:40,result:30,answer:70},{left:9,op:"+",right:null,result:99,answer:90},{left:100,op:"-",right:null,result:50,answer:50}]
      ],
      order: [
        {mode:"asc",values:[51,83,75,70,62,49]},
        {mode:"desc",values:[59,86,42,60,15,73]},
        {mode:"compare",left:68,right:62},
        {mode:"asc",values:[22,68,35,81,54,75]},
        {mode:"desc",values:[19,47,73,28,64,55]},
        {mode:"compare",left:35,right:53},
        {mode:"asc",values:[14,40,27,72,58,33]},
        {mode:"desc",values:[91,76,48,83,29,67]},
        {mode:"compare",left:90,right:89},
        {mode:"asc",values:[6,16,60,26,62,36]},
        {mode:"desc",values:[12,21,42,24,84,48]},
        {mode:"compare",left:74,right:47}
      ],
      written: [
        [[14,"+",65],[53,"+",32],[21,"+",51],[73,"+",22]],
        [[35,"+",43],[24,"+",52],[46,"+",31],[62,"+",17]],
        [[68,"-",10],[75,"-",30],[54,"-",20],[81,"-",10]],
        [[12,"+",37],[45,"+",23],[61,"+",18],[30,"+",46]],
        [[89,"-",20],[76,"-",30],[58,"-",40],[97,"-",50]],
        [[26,"+",52],[71,"+",14],[33,"+",45],[64,"+",25]],
        [[27,"+",15],[38,"+",24],[19,"+",13],[46,"+",17]],
        [[25,"+",28],[34,"+",19],[57,"+",16],[29,"+",34]],
        [[48,"+",13],[36,"+",29],[17,"+",26],[58,"+",19]],
        [[24,"+",68],[39,"+",45],[16,"+",59],[47,"+",28]]
      ]
    };

    sets.hours = Array.from({length:50},(_,i)=>{
      const minutes=[0,15,30,45];
      const minute=minutes[i%minutes.length];
      const hour=i%24;
      return {hour,minute,label:`${hour} h ${pad2(minute)}`};
    });

    const state = {
      activeInput: null,
      index: {mental:0,order:0,written:0,hours:0},
      orderAnswer: [],
      selectedCompare: null,
      advanceTimer: null
    };

    function colorNumber(value) {
      const text = String(value);
      if (text.length===1) return `<span class="num"><span class="ones">${text}</span></span>`;
      return `<span class="num"><span class="tens">${text.slice(0,-1)}</span><span class="ones">${text.slice(-1)}</span></span>`;
    }

    function answerFor(item) {
      if (!Array.isArray(item)) return item.answer;
      const [a,op,b]=item;
      return op==="+"?a+b:a-b;
    }

    function pad2(value) {
      const text=String(value);
      return text.length<2?"0"+text:text;
    }

    function partOfDay(hour) {
      if (hour>=6&&hour<12) return "matin";
      if (hour>=12&&hour<18) return "apresmidi";
      if (hour>=18&&hour<22) return "soir";
      return "nuit";
    }

    function setClass(el,cls,on){ if(!el)return; on?el.classList.add(cls):el.classList.remove(cls); }

    function clearAutoAdvance(){ if(state.advanceTimer){clearTimeout(state.advanceTimer);state.advanceTimer=null;} }

    function scheduleNext(id){
      clearAutoAdvance();
      state.advanceTimer=setTimeout(()=>{
        const active=document.querySelector(".screen.active");
        if(active&&active.id===id) nextSet(id);
      },1100);
    }

    function allInputsCorrect(selector){
      const inputs=[...document.querySelectorAll(selector)];
      return inputs.length>0&&inputs.every(i=>i.value.trim()!==""&&Number(i.value)===Number(i.dataset.expected));
    }

    function allWrittenBoardsCorrect(){
      const boards=[...document.querySelectorAll("#written .written-board")];
      return boards.length>0&&boards.every(board=>{
        const exercise=board.closest(".exercise");
        const expected=pad2(board.dataset.expected);
        const actual=[...exercise.querySelectorAll(".written-digit")].map(i=>i.value).join("");
        const retenueInput=exercise.querySelector(".retenue-input");
        return actual===expected&&(!retenueInput||retenueInput.value==="1");
      });
    }

    function makeInput(expected,kind){
      return `<div class="answer-row"><input inputmode="numeric" pattern="[0-9]*" data-expected="${expected}" data-kind="${kind}" aria-label="Réponse"><button type="button" class="soft check-one">OK</button></div><div class="feedback"></div>`;
    }

    function renderMental(){
      document.querySelector("#mentalGrid").innerHTML=sets.mental[state.index.mental].map(item=>{
        if(!Array.isArray(item)){
          const left=item.left===null?`<span class="num"><span class="tens">?</span></span>`:colorNumber(item.left);
          const right=item.right===null?`<span class="num"><span class="tens">?</span></span>`:colorNumber(item.right);
          return `<article class="exercise"><div class="prompt">${left} ${item.op} ${right} = ${colorNumber(item.result)}</div>${makeInput(item.answer,"mental")}</article>`;
        }
        const [a,op,b]=item;
        return `<article class="exercise"><div class="prompt">${colorNumber(a)} ${op} ${colorNumber(b)} =</div>${makeInput(answerFor(item),"mental")}</article>`;
      }).join("");
    }

    function renderOrder(){
      state.orderAnswer=[];
      state.selectedCompare=null;
      const task=sets.order[state.index.order];
      const title=task.mode==="desc"?"Du plus grand au plus petit":task.mode==="compare"?"Choisis le bon signe":"Du plus petit au plus grand";
      document.querySelector("#order .small-prompt").textContent=title;
      if(task.mode==="compare"){
        document.querySelector("#orderBank").innerHTML=`<div class="prompt">${colorNumber(task.left)} <span class="compare-display muted-text" id="compareDisplay">?</span> ${colorNumber(task.right)}</div>`;
        document.querySelector("#orderAnswer").innerHTML=`<div class="symbol-row"><button class="symbol-button" data-compare="lt" type="button">&lt;</button><button class="symbol-button" data-compare="gt" type="button">&gt;</button></div>`;
      } else {
        document.querySelector("#orderBank").innerHTML=task.values.map(v=>`<button class="pill" data-order-value="${v}" type="button">${colorNumber(v)}</button>`).join("");
        document.querySelector("#orderAnswer").innerHTML="";
      }
      document.querySelector("#orderFeedback").textContent="";
      document.querySelector("#orderFeedback").className="feedback";
    }    function renderWritten(){
      document.querySelector("#writtenGrid").innerHTML=sets.written[state.index.written].map(item=>{
        const [a,op,b]=item;
        const at=Math.floor(a/10),au=a%10,bt=Math.floor(b/10),bu=b%10;
        const answer=answerFor(item);
        const answerText=pad2(answer);
        const needsCarry=op==="+"&&(au+bu)>=10;
        const retenueRow=needsCarry?`<span class="retenue-cell"></span><input class="retenue-cell retenue-input" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-kind="retenue-digit" data-expected="1" aria-label="Retenue"><span class="retenue-cell col-end"></span>`:"";
        return `<article class="exercise"><div class="written-board" data-expected="${answer}"><span></span><span class="tens">d</span><span class="ones col-end">u</span>${retenueRow}<span></span><span class="tens">${at}</span><span class="ones col-end">${au}</span><span class="operator">${op}</span><span class="tens">${bt}</span><span class="ones col-end">${bu}</span><span class="rule"></span><span class="last-row"></span><input class="last-row written-digit tens-answer" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-kind="written-digit" data-expected="${answerText[0]}" aria-label="Dizaine"><input class="last-row written-digit ones-answer col-end" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-kind="written-digit" data-expected="${answerText[1]}" aria-label="Unité"></div><div class="feedback"></div></article>`;
      }).join("");
    }

    function renderHours(){
      const target=sets.hours[state.index.hours];
      const period=partOfDay(target.hour);
      const periodLabel={matin:"Matin",apresmidi:"Après-midi",soir:"Soir",nuit:"Nuit"}[period];
      document.querySelector("#hoursGrid").innerHTML=`<article class="exercise"><div class="clock-area">${clockSvg(target.hour,target.minute)}<div><div class="time-context"><span class="sky-icon ${period}"></span>${periodLabel}</div><div class="small-prompt">Quelle heure indique l'horloge ?</div><div class="time-answer"><input inputmode="numeric" pattern="[0-9]*" data-kind="time-hour" aria-label="Heures"><span class="time-separator">h</span><input inputmode="numeric" pattern="[0-9]*" data-kind="time-minute" aria-label="Minutes"></div><div class="feedback" id="hoursFeedback"></div></div></div></article>`;
    }

    function clockSvg(hour,minute){
      const hourAngle=((hour%12)*30)+(minute*0.5);
      const minuteAngle=minute*6;
      const numbers=Array.from({length:12},(_,i)=>{
        const v=i+1,angle=(v*30-90)*Math.PI/180;
        const x=100+Math.cos(angle)*76,y=100+Math.sin(angle)*76;
        return `<text class="clock-number" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${v}</text>`;
      }).join("");
      const ticks=Array.from({length:60},(_,i)=>{
        const angle=(i*6-90)*Math.PI/180,outer=92,inner=i%5===0?84:88;
        const x1=100+Math.cos(angle)*outer,y1=100+Math.sin(angle)*outer;
        const x2=100+Math.cos(angle)*inner,y2=100+Math.sin(angle)*inner;
        return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#94a3b8" stroke-width="${i%5===0?2:1}"/>`;
      }).join("");
      return `<svg class="clock-face" viewBox="0 0 200 200" role="img" aria-label="Horloge à aiguilles"><circle cx="100" cy="100" r="96" fill="#fff" stroke="#334155" stroke-width="4"/>${ticks}${numbers}<line class="hand-hour" x1="100" y1="100" x2="100" y2="48" transform="rotate(${hourAngle} 100 100)"/><line class="hand-minute" x1="100" y1="100" x2="100" y2="28" transform="rotate(${minuteAngle} 100 100)"/><circle cx="100" cy="100" r="6" fill="#243043"/></svg>`;
    }

    function setFeedback(input,ok){
      const feedback=input.closest(".exercise").querySelector(".feedback");
      feedback.textContent=ok?"Bravo !":"Essaie encore";
      feedback.className=`feedback ${ok?"ok":"bad"}`;
      input.style.borderColor=ok?"var(--ok)":"var(--bad)";
    }

    function checkInput(input){
      if(input.dataset.kind==="written-digit"||input.dataset.kind==="retenue-digit") return checkWrittenBoard(input.closest(".exercise"));
      const ok=input.value.trim()!==""&&Number(input.value)===Number(input.dataset.expected);
      setFeedback(input,ok);
      if(ok&&input.dataset.kind==="mental"&&allInputsCorrect("#mental input")) scheduleNext("mental");
      return ok;
    }

    function maybeAutoCheckInput(input){
      if(!input) return;
      if(input.dataset.kind==="written-digit"||input.dataset.kind==="retenue-digit"){
        const exercise=input.closest(".exercise");
        const digits=[...exercise.querySelectorAll(".written-digit")];
        const retenueInput=exercise.querySelector(".retenue-input");
        const digitsComplete=digits.every(d=>d.value.length===1);
        const retenueComplete=!retenueInput||retenueInput.value.length===1;
        if(digitsComplete&&retenueComplete) checkWrittenBoard(exercise);
        return;
      }
      if(input.dataset.kind==="time-hour"||input.dataset.kind==="time-minute"){
        const hourInput=document.querySelector('[data-kind="time-hour"]');
        const minuteInput=document.querySelector('[data-kind="time-minute"]');
        if(input.dataset.kind==="time-hour"&&input.value.length>=2){
          if(minuteInput){state.activeInput=minuteInput;minuteInput.focus();minuteInput.select();}
        }
        if(hourInput&&minuteInput&&hourInput.value.length>0&&minuteInput.value.length===2) checkHours();
        return;
      }
      if(input.dataset.kind!=="mental") return;
      if(input.value.length===String(input.dataset.expected).length) checkInput(input);
    }

    function checkWrittenBoard(exercise){
      const inputs=[...exercise.querySelectorAll(".written-digit")];
      const expected=pad2(exercise.querySelector(".written-board").dataset.expected);
      const actual=inputs.map(i=>i.value).join("");
      const retenueInput=exercise.querySelector(".retenue-input");
      const retenueFilled=!retenueInput||retenueInput.value!=="";
      const retenueOk=!retenueInput||retenueInput.value==="1";
      const digitsOk=actual.length===2&&actual===expected;
      const ok=digitsOk&&retenueOk;
      const feedback=exercise.querySelector(".feedback");
      feedback.textContent=ok?"Bravo !":digitsOk&&retenueInput&&!retenueOk?"N'oublie pas la retenue !":"Essaie encore";
      feedback.className=`feedback ${ok?"ok":"bad"}`;
      inputs.forEach((inp,i)=>{inp.style.borderColor=inp.value===expected[i]?"var(--ok)":"var(--bad)";});
      if(retenueInput) retenueInput.style.borderColor=retenueInput.value==="1"?"var(--ok)":retenueFilled?"var(--bad)":"#d1d5db";
      if(ok&&allWrittenBoardsCorrect()) scheduleNext("written");
      return ok;
    }

    function checkScreen(id){
      if(id==="order") return checkOrder();
      if(id==="hours") return checkHours();
      if(id==="written"){document.querySelectorAll("#written .exercise").forEach(checkWrittenBoard);return;}
      document.querySelectorAll(`#${id} input`).forEach(checkInput);
    }

    function checkOrder(){
      const task=sets.order[state.index.order];
      const feedback=document.querySelector("#orderFeedback");
      if(task.mode==="compare"){
        const expected=task.left<task.right?"lt":"gt";
        document.querySelectorAll("[data-compare]").forEach(b=>{
          setClass(b,"correct",b.dataset.compare===expected);
          setClass(b,"wrong",b.classList.contains("selected")&&b.dataset.compare!==expected);
        });
        const ok=state.selectedCompare===expected;
        feedback.textContent=ok?"Bravo !":"Regarde quel nombre est le plus grand";
        feedback.className=`feedback ${ok?"ok":"bad"}`;
        if(ok) scheduleNext("order");
        return;
      }
      const expectedValues=[...task.values].sort((a,b)=>task.mode==="desc"?b-a:a-b);
      const ok=expectedValues.join(",")===state.orderAnswer.join(",");
      feedback.textContent=ok?"Bravo !":task.mode==="desc"?"Regarde le nombre le plus grand qui reste":"Regarde le nombre le plus petit qui reste";
      feedback.className=`feedback ${ok?"ok":"bad"}`;
      if(ok) scheduleNext("order");
    }

    function checkHours(){
      const target=sets.hours[state.index.hours];
      const feedback=document.querySelector("#hoursFeedback");
      const hourInput=document.querySelector('[data-kind="time-hour"]');
      const minuteInput=document.querySelector('[data-kind="time-minute"]');
      const hour=Number(hourInput.value);
      const minute=Number(pad2(minuteInput.value));
      const ok=hour===target.hour&&minute===target.minute&&minuteInput.value.trim()!=="";
      hourInput.style.borderColor=hour===target.hour?"var(--ok)":"var(--bad)";
      minuteInput.style.borderColor=minute===target.minute&&minuteInput.value.trim()!==""?"var(--ok)":"var(--bad)";
      feedback.textContent=ok?"Bravo !":`Essaie encore : écris les minutes avec deux chiffres`;
      feedback.className=`feedback ${ok?"ok":"bad"}`;
      if(ok) scheduleNext("hours");
    }

    function nextSet(id){
      clearAutoAdvance();
      if(id==="hours"){
        let next=state.index.hours;
        while(next===state.index.hours&&sets.hours.length>1) next=Math.floor(Math.random()*sets.hours.length);
        state.index.hours=next;
        renderHours();wireInputs();return;
      }
      if(id==="order"||id==="mental"||id==="written"){
        let next=state.index[id];
        while(next===state.index[id]&&sets[id].length>1) next=Math.floor(Math.random()*sets[id].length);
        state.index[id]=next;
        renderAll();return;
      }
    }

    function renderAll(){
      renderMental();renderOrder();renderWritten();renderHours();
      wireInputs();updateKeypadVisibility();
    }

    function updateKeypadVisibility(){
      const activeScreen=document.querySelector(".screen.active");
      const keypad=document.querySelector(".keypad");
      if(!activeScreen||!keypad) return;
      keypad.style.display=activeScreen.id==="order"?"none":"grid";
    }

    function wireInputs(){
      document.querySelectorAll("input").forEach(input=>{
        input.addEventListener("focus",()=>{state.activeInput=input;});
        input.addEventListener("click",()=>{state.activeInput=input;});
        input.addEventListener("touchstart",()=>{state.activeInput=input;});
        input.addEventListener("input",()=>{
          const maxLength=(input.dataset.kind==="written-digit"||input.dataset.kind==="retenue-digit")?1:2;
          input.value=input.value.replace(/\D/g,"").slice(0,maxLength);
          input.style.borderColor="#d1d5db";
          const feedback=input.closest(".exercise").querySelector(".feedback");
          feedback.textContent="";feedback.className="feedback";
          maybeAutoCheckInput(input);
        });
      });
      document.querySelectorAll(".check-one").forEach(b=>b.addEventListener("click",()=>checkInput(b.parentElement.querySelector("input"))));
      document.querySelectorAll("[data-order-value]").forEach(b=>{
        b.addEventListener("click",()=>{
          if(b.classList.contains("selected")) return;
          const value=Number(b.dataset.orderValue);
          b.classList.add("selected");
          state.orderAnswer.push(value);
          document.querySelector("#orderAnswer").insertAdjacentHTML("beforeend",`<span class="pill">${colorNumber(value)}</span>`);
          const task=sets.order[state.index.order];
          if(task.mode!=="compare"&&state.orderAnswer.length===task.values.length) checkOrder();
        });
      });
      document.querySelectorAll("[data-compare]").forEach(b=>{
        b.addEventListener("click",()=>{
          state.selectedCompare=b.dataset.compare;
          document.querySelectorAll("[data-compare]").forEach(i=>i.classList.remove("selected","correct","wrong"));
          b.classList.add("selected");
          const display=document.querySelector("#compareDisplay");
          if(display){display.textContent=b.dataset.compare==="lt"?"<":">";display.classList.remove("muted-text");}
          checkOrder();
        });
      });
    }

    document.querySelectorAll("nav button").forEach(b=>{
      b.addEventListener("click",()=>{
        document.querySelectorAll("nav button").forEach(i=>i.classList.remove("active"));
        document.querySelectorAll(".screen").forEach(i=>i.classList.remove("active"));
        b.classList.add("active");
        document.querySelector(`#${b.dataset.screen}`).classList.add("active");
        state.activeInput=document.querySelector(".screen.active input");
        if(state.activeInput) state.activeInput.focus();
        updateKeypadVisibility();
      });
    });

    document.querySelectorAll("[data-check-screen]").forEach(b=>b.addEventListener("click",()=>checkScreen(b.dataset.checkScreen)));
    document.querySelectorAll("[data-new]").forEach(b=>b.addEventListener("click",()=>nextSet(b.dataset.new)));

    document.querySelector("#undoOrder").addEventListener("click",()=>{
      const removed=state.orderAnswer.pop();
      if(removed===undefined) return;
      const btn=document.querySelector(`#orderBank [data-order-value="${removed}"]`);
      if(btn) btn.classList.remove("selected");
      const last=document.querySelector("#orderAnswer").lastElementChild;
      if(last) last.remove();
    });

    document.querySelector("#resetProgress").addEventListener("click",()=>{
      if(!confirm("Recommencer depuis le début ?")) return;
      Object.keys(state.index).forEach(k=>{state.index[k]=0;});
      renderAll();
    });

    document.querySelectorAll("[data-key]").forEach(b=>{
      b.addEventListener("click",()=>{
        const activeScreen=document.querySelector(".screen.active");
        const focusedInput=document.activeElement&&document.activeElement.tagName==="INPUT"&&activeScreen&&activeScreen.contains(document.activeElement)?document.activeElement:null;
        const activeInputIsUsable=state.activeInput&&state.activeInput.isConnected&&activeScreen&&activeScreen.contains(state.activeInput);
        const input=focusedInput?focusedInput:activeInputIsUsable?state.activeInput:activeScreen?activeScreen.querySelector("input"):null;
        if(!input) return;
        state.activeInput=input;input.focus();
        const key=b.dataset.key;
        const maxLength=(input.dataset.kind==="written-digit"||input.dataset.kind==="retenue-digit")?1:2;
        if(/^\d$/.test(key)) input.value=(input.value+key).slice(0,maxLength);
        if(key==="back") input.value=input.value.slice(0,-1);
        if(key==="clear") input.value="";
        if(key==="next"){
          const inputs=[...document.querySelectorAll(".screen.active input")];
          const next=inputs[(inputs.indexOf(input)+1)%inputs.length];
          if(next){state.activeInput=next;next.focus();}
          return;
        }
        input.dispatchEvent(new Event("input"));
      });
    });

    renderAll();
  </script>
</body>
</html>
